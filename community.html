<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d50000">
<title>GAMEND X — Community</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- Apply index.html settings before UI appears -->
<script>
(function(){
  const themes=[
    ["#d50000","#ff1744"],
    ["#0066ff","#00c6ff"],
    ["#00a86b","#00d99b"],
    ["#e30613","#ff4b57"],
    ["#d08a00","#ffc62e"],
    ["#7b2cff","#c14dff"]
  ];

  let theme=Math.min(
    5,
    Math.max(0,Number(localStorage.getItem("gx_theme")||0))
  );

  const mode=localStorage.getItem("gx_mode")||"dark";

  let motion=true;
  try{
    const v=JSON.parse(localStorage.getItem("gx_motion"));
    motion=v==null?true:!!v;
  }catch{}

  const root=document.documentElement;
  root.dataset.theme=theme;
  root.classList.toggle("light",mode==="light");
  root.classList.toggle("reduced-motion",!motion);

  const c=themes[theme];
  root.style.setProperty("--primary",c[0]);
  root.style.setProperty("--primary2",c[1]);
})();
</script>

<style>
:root{
  --primary:#d50000;
  --primary2:#ff1744;
  --accent:#00d9ff;
  --bg:#0b0e14;
  --card:#151a22;
  --text:#f7f9fc;
  --muted:#a8b2c0;
  --border:#242b36;
  --glass:rgba(18,22,30,.84);
  --shadow:0 16px 44px rgba(0,0,0,.32);
  --danger:#ff3b30;
  --success:#19c37d;
}

html.light{
  --bg:#f4f6fb;
  --card:#fff;
  --text:#172033;
  --muted:#687185;
  --border:#e7eaf0;
  --glass:rgba(255,255,255,.84);
  --shadow:0 14px 40px rgba(15,23,42,.08);
}

html[data-theme="1"]{
  --primary:#0066ff;
  --primary2:#00c6ff;
}

html[data-theme="2"]{
  --primary:#00a86b;
  --primary2:#00d99b;
}

html[data-theme="3"]{
  --primary:#e30613;
  --primary2:#ff4b57;
}

html[data-theme="4"]{
  --primary:#d08a00;
  --primary2:#ffc62e;
}

html[data-theme="5"]{
  --primary:#7b2cff;
  --primary2:#c14dff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Poppins,Arial,sans-serif;
  transition:
    background .25s ease,
    color .25s ease;
}

/* BACKGROUND */
.moving-bg{
  position:fixed;
  inset:0;
  z-index:-5;
  overflow:hidden;
  pointer-events:none;
  background:
    radial-gradient(circle at 10% 10%,
      color-mix(in srgb,var(--primary) 14%,transparent),
      transparent 32%),
    radial-gradient(circle at 90% 90%,
      color-mix(in srgb,var(--primary2) 10%,transparent),
      transparent 32%),
    var(--bg);
}

.moving-bg::before,
.moving-bg::after{
  content:"";
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;
  filter:blur(70px);
  opacity:.18;
  background:var(--primary);
}

.moving-bg::before{
  top:-80px;
  left:-80px;
  animation:floatOne 12s ease-in-out infinite alternate;
}

.moving-bg::after{
  right:-100px;
  bottom:-100px;
  background:var(--primary2);
  animation:floatTwo 15s ease-in-out infinite alternate;
}

@keyframes floatOne{
  from{transform:translate(0,0)}
  to{transform:translate(90px,100px)}
}

@keyframes floatTwo{
  from{transform:translate(0,0)}
  to{transform:translate(-80px,-70px)}
}

html.reduced-motion .moving-bg::before,
html.reduced-motion .moving-bg::after{
  animation:none!important;
}

/* HEADER */
.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:64px;
  z-index:50;
  display:flex;
  align-items:center;
  gap:12px;
  padding:
    env(safe-area-inset-top)
    14px
    0;
  background:var(--glass);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.back-btn{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  cursor:pointer;
}

.back-btn:active{
  transform:scale(.93);
}

.title-wrap{
  min-width:0;
  flex:1;
}

.title{
  margin:0;
  font-size:18px;
  font-weight:800;
  line-height:1.1;
}

.subtitle{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
  font-weight:500;
}

.online-pill{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--card);
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}

.online-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--success);
  box-shadow:0 0 10px rgba(25,195,125,.65);
}

/* APP */
.app{
  position:fixed;
  inset:64px 0 0;
  display:flex;
  flex-direction:column;
  min-height:0;
}

/* GUEST */
.guest-screen{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:var(--bg);
}

.guest-card{
  width:min(420px,100%);
  padding:26px 20px 22px;
  border:1px solid var(--border);
  border-radius:24px;
  background:var(--glass);
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  text-align:center;
}

.guest-icon{
  width:68px;
  height:68px;
  margin:0 auto 15px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;
  font-size:27px;
  box-shadow:0 12px 28px color-mix(
    in srgb,var(--primary) 25%,transparent
  );
}

.guest-card h2{
  margin:0 0 7px;
  font-size:22px;
}

.guest-card p{
  margin:0 auto 20px;
  max-width:330px;
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.name-input{
  width:100%;
  height:50px;
  border:1px solid var(--border);
  border-radius:15px;
  outline:none;
  padding:0 15px;
  background:var(--card);
  color:var(--text);
  font-family:inherit;
  font-size:14px;
}

.name-input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(
    in srgb,var(--primary) 12%,transparent
  );
}

.start-btn{
  width:100%;
  height:50px;
  margin-top:12px;
  border:0;
  border-radius:15px;
  background:linear-gradient(
    135deg,
    var(--primary),
    var(--primary2)
  );
  color:#fff;
  font-family:inherit;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 10px 25px color-mix(
    in srgb,var(--primary) 25%,transparent
  );
}

.start-btn:active{
  transform:scale(.98);
}

/* CHAT */
.chat-shell{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:15px 12px 10px;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
  width:4px;
}

.messages::-webkit-scrollbar-thumb{
  background:var(--border);
  border-radius:20px;
}

.date-divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:7px 0 14px;
  color:var(--muted);
  font-size:10px;
  font-weight:600;
}

.date-divider::before,
.date-divider::after{
  content:"";
  height:1px;
  flex:1;
  background:var(--border);
}

/* MESSAGE */
.message-row{
  display:flex;
  margin:7px 0;
  width:100%;
  position:relative;
}

.message-row.mine{
  justify-content:flex-end;
}

.message{
  position:relative;
  width:max-content;
  max-width:min(82%,480px);
  min-width:72px;
  padding:9px 11px 7px;
  border:1px solid var(--border);
  border-radius:17px;
  background:var(--card);
  box-shadow:0 5px 18px rgba(0,0,0,.07);
  user-select:none;
  -webkit-user-select:none;
  touch-action:pan-y;
  transition:
    transform .16s ease,
    background .2s ease,
    border-color .2s ease;
}

.message-row.mine .message{
  border-color:color-mix(
    in srgb,var(--primary) 35%,var(--border)
  );
  background:linear-gradient(
    145deg,
    color-mix(in srgb,var(--primary) 18%,var(--card)),
    var(--card)
  );
}

.message.swiping{
  transition:none;
}

.sender{
  margin-bottom:3px;
  color:var(--primary2);
  font-size:10px;
  font-weight:700;
}

.mine .sender{
  color:var(--primary);
}

.message-text{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
  font-size:13px;
  line-height:1.55;
  user-select:text;
  -webkit-user-select:text;
}

.message-meta{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:4px;
  margin-top:3px;
  color:var(--muted);
  font-size:8px;
}

.edited{
  font-size:8px;
}

/* REPLY PREVIEW */
.reply-preview{
  margin-bottom:7px;
  padding:6px 8px;
  border-left:3px solid var(--primary);
  border-radius:7px;
  background:color-mix(
    in srgb,var(--primary) 8%,var(--bg)
  );
  overflow:hidden;
}

.reply-name{
  color:var(--primary2);
  font-size:9px;
  font-weight:700;
}

.reply-text{
  margin-top:2px;
  color:var(--muted);
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* INPUT */
.composer{
  position:relative;
  flex:0 0 auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:
    8px 10px
    calc(8px + env(safe-area-inset-bottom));
  background:var(--glass);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
}

.reply-bar{
  position:absolute;
  left:10px;
  right:10px;
  bottom:calc(100% + 7px);
  display:none;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--glass);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.reply-bar.show{
  display:flex;
}

.reply-bar-icon{
  width:28px;
  height:28px;
  flex:0 0 28px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:color-mix(
    in srgb,var(--primary) 12%,transparent
  );
  color:var(--primary2);
}

.reply-info{
  flex:1;
  min-width:0;
}

.reply-info strong{
  display:block;
  font-size:10px;
  color:var(--primary2);
}

.reply-info span{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.reply-cancel{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--muted);
}

.message-input{
  flex:1;
  min-width:0;
  height:46px;
  border:1px solid var(--border);
  border-radius:15px;
  outline:none;
  padding:0 13px;
  background:var(--card);
  color:var(--text);
  font-family:inherit;
  font-size:13px;
}

.message-input:focus{
  border-color:var(--primary);
}

.send-btn{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border:0;
  border-radius:15px;
  background:linear-gradient(
    135deg,
    var(--primary),
    var(--primary2)
  );
  color:#fff;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 8px 20px color-mix(
    in srgb,var(--primary) 22%,transparent
  );
}

.send-btn:disabled{
  opacity:.45;
  box-shadow:none;
}

.send-btn:active{
  transform:scale(.93);
}

/* EMPTY / LOADING */
.center-state{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  text-align:center;
}

.center-state i{
  margin-bottom:10px;
  color:var(--primary);
  font-size:27px;
}

.center-state strong{
  color:var(--text);
  font-size:13px;
}

.center-state span{
  margin-top:4px;
  font-size:10px;
}

/* CONTEXT MENU */
.context-menu{
  position:fixed;
  z-index:100;
  display:none;
  min-width:155px;
  padding:6px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--glass);
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.context-menu.show{
  display:block;
}

.context-item{
  width:100%;
  height:42px;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  border-radius:10px;
  padding:0 11px;
  background:transparent;
  color:var(--text);
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  text-align:left;
}

.context-item:active{
  background:color-mix(
    in srgb,var(--primary) 10%,transparent
  );
}

.context-item.delete{
  color:var(--danger);
}

/* MODAL */
.modal-layer{
  position:fixed;
  inset:0;
  z-index:120;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

.modal-layer.show{
  display:flex;
}

.modal{
  width:min(430px,100%);
  border:1px solid var(--border);
  border-radius:22px;
  padding:19px;
  background:var(--card);
  box-shadow:var(--shadow);
}

.modal-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.modal-head h3{
  flex:1;
  margin:0;
  font-size:16px;
}

.modal-close{
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;
  background:color-mix(
    in srgb,var(--primary) 8%,transparent
  );
  color:var(--muted);
}

.edit-area{
  width:100%;
  min-height:120px;
  max-height:240px;
  resize:none;
  border:1px solid var(--border);
  border-radius:14px;
  outline:none;
  padding:12px;
  background:var(--bg);
  color:var(--text);
  font-family:inherit;
  font-size:13px;
  line-height:1.5;
}

.edit-area:focus{
  border-color:var(--primary);
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.modal-btn{
  flex:1;
  height:44px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card);
  color:var(--text);
  font-family:inherit;
  font-weight:700;
}

.modal-btn.primary{
  border:0;
  color:#fff;
  background:linear-gradient(
    135deg,
    var(--primary),
    var(--primary2)
  );
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  z-index:200;
  max-width:85%;
  padding:10px 14px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--glass);
  color:var(--text);
  font-size:11px;
  font-weight:600;
  box-shadow:var(--shadow);
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  transition:.22s ease;
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* REDUCED MOTION */
html.reduced-motion *,
html.reduced-motion *::before,
html.reduced-motion *::after{
  animation-duration:.001ms!important;
  animation-iteration-count:1!important;
  transition-duration:.001ms!important;
  scroll-behavior:auto!important;
}

/* SMALL MOBILE */
@media(max-width:380px){
  .topbar{
    padding-left:10px;
    padding-right:10px;
  }

  .title{
    font-size:16px;
  }

  .online-pill{
    padding:6px 8px;
    font-size:10px;
  }

  .message{
    max-width:87%;
  }

  .messages{
    padding-left:8px;
    padding-right:8px;
  }
}
</style>
</head>

<body>

<div class="moving-bg"></div>

<header class="topbar">
  <button class="back-btn" id="backBtn" aria-label="Back">
    <i class="fas fa-arrow-left"></i>
  </button>

  <div class="title-wrap">
    <h1 class="title">Community</h1>
    <div class="subtitle">GAMEND X Community Chat</div>
  </div>

  <div class="online-pill">
    <span class="online-dot"></span>
    <span id="onlineCount">0 online</span>
  </div>
</header>

<main class="app">

  <!-- GUEST NAME -->
  <section class="guest-screen" id="guestScreen">
    <div class="guest-card">
      <div class="guest-icon">
        <i class="fas fa-comments"></i>
      </div>

      <h2>Join Community</h2>

      <p>
        Choose a display name and join the GAMEND X community chat.
      </p>

      <input
        id="guestName"
        class="name-input"
        type="text"
        maxlength="30"
        autocomplete="off"
        placeholder="Enter your name"
      >

      <button class="start-btn" id="joinBtn">
        <i class="fas fa-right-to-bracket"></i>
        &nbsp; Join Chat
      </button>
    </div>
  </section>

  <!-- CHAT -->
  <section class="chat-shell" id="chatShell" hidden>

    <div class="messages" id="messages">
      <div class="center-state">
        <i class="fas fa-spinner fa-spin"></i>
        <strong>Loading community...</strong>
        <span>Please wait</span>
      </div>
    </div>

    <div class="composer">

      <div class="reply-bar" id="replyBar">
        <div class="reply-bar-icon">
          <i class="fas fa-reply"></i>
        </div>

        <div class="reply-info">
          <strong id="replyName">Reply</strong>
          <span id="replyText"></span>
        </div>

        <button class="reply-cancel" id="cancelReply">
          <i class="fas fa-xmark"></i>
        </button>
      </div>

      <input
        id="messageInput"
        class="message-input"
        type="text"
        maxlength="1000"
        autocomplete="off"
        placeholder="Message community..."
      >

      <button class="send-btn" id="sendBtn" disabled>
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>

  </section>
</main>

<!-- LONG PRESS MENU -->
<div class="context-menu" id="contextMenu">
  <button class="context-item" id="editMessageBtn">
    <i class="fas fa-pen"></i>
    Edit
  </button>

  <button class="context-item delete" id="deleteMessageBtn">
    <i class="fas fa-trash"></i>
    Delete
  </button>
</div>

<!-- EDIT MODAL -->
<div class="modal-layer" id="editModal">
  <div class="modal">

    <div class="modal-head">
      <h3>Edit message</h3>

      <button class="modal-close" id="editClose">
        <i class="fas fa-xmark"></i>
      </button>
    </div>

    <textarea
      id="editArea"
      class="edit-area"
      maxlength="1000"
    ></textarea>

    <div class="modal-actions">
      <button class="modal-btn" id="editCancel">
        Cancel
      </button>

      <button class="modal-btn primary" id="editDone">
        Done
      </button>
    </div>

  </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-layer" id="deleteModal">
  <div class="modal">

    <div class="modal-head">
      <h3>Delete message?</h3>

      <button class="modal-close" id="deleteClose">
        <i class="fas fa-xmark"></i>
      </button>
    </div>

    <div style="

  try{
    const v=JSON.parse(localStorage.getItem(key));
    return v==null?def:v;
  }catch{
    return def;
  }
}

function applyIndexSettings(){

  let theme=Math.min(
    5,
    Math.max(
      0,
      Number(localStorage.getItem("gx_theme")||0)
    )
  );

  const mode=localStorage.getItem("gx_mode")||"dark";

  const motion=getJSON("gx_motion",true);

  document.documentElement.dataset.theme=theme;

  document.documentElement.classList.toggle(
    "light",
    mode==="light"
  );

  document.documentElement.classList.toggle(
    "reduced-motion",
    !motion
  );

  const colors=themeColors[theme];

  document.documentElement.style.setProperty(
    "--primary",
    colors[0]
  );

  document.documentElement.style.setProperty(
    "--primary2",
    colors[1]
  );
}

async function startPresence(){

/* ---------------------------------------------------------

--------------------------------------------------------- */
let messageMap=new Map();

let replyTarget=null;

let contextMessage=null;

let editingMessage=null;

let deletingMessage=null;

/* ---------------------------------------------------------
   SAFE TEXT
--------------------------------------------------------- */
function safeText(value){

  return String(value??"")
    .replace(/\s+/g," ")
    .trim();
}

function formatTime(timestamp){

  if(!timestamp)return "";

  const date=new Date(timestamp);

  if(Number.isNaN(date.getTime())){
    return "";
  }

  return date.toLocaleTimeString(
    [],
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );
}

function sameDay(a,b){

  const x=new Date(a);
  const y=new Date(b);

  return x.getFullYear()===y.getFullYear()
    &&x.getMonth()===y.getMonth()
    &&x.getDate()===y.getDate();
}

function formatDate(timestamp){

  const date=new Date(timestamp);

  if(
    date.toDateString()===
    new Date().toDateString()
  ){
    return "Today";
  }

  const yesterday=new Date();

  yesterday.setDate(
    yesterday.getDate()-1
  );

  if(
    date.toDateString()===
    yesterday.toDateString()
  ){
    return "Yesterday";
  }

  return date.toLocaleDateString(
    [],
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );
}

/* ---------------------------------------------------------
   LISTEN MESSAGES
--------------------------------------------------------- */
function listenMessages(){

  const messagesRef=f.ref(
    db,
    "community/messages"
  );

  if(messagesUnsubscribe){
    messagesUnsubscribe();
  }

  messagesUnsubscribe=f.onValue(
    messagesRef,
    snapshot=>{

      messageMap.clear();

      snapshot.forEach(child=>{

        const value=child.val();

        if(!value)return;

        value.id=child.key;

        messageMap.set(
          child.key,
          value
        );
      });

      renderMessages();
    },
    error=>{
      console.error(error);

      toast("Unable to load messages");
    }
  );
}

/* ---------------------------------------------------------
   RENDER
--------------------------------------------------------- */
function renderMessages(){

  const list=Array.from(
    messageMap.values()
  );

  list.sort(
    (a,b)=>
      Number(a.createdAt||0)-
      Number(b.createdAt||0)
  );

  if(!list.length){

    messages.innerHTML=`
      <div class="center-state">
        <i class="fas fa-comments"></i>
        <strong>No messages yet</strong>
        <span>Be the first one to start the conversation.</span>
      </div>
    `;

    return;
  }

  const wasNearBottom=
    messages.scrollHeight-
    messages.scrollTop-
    messages.clientHeight<100;

  messages.innerHTML="";

  let previousTime=null;

  for(const msg of list){

    if(
      previousTime!==null &&
      !sameDay(
        previousTime,
        msg.createdAt||Date.now()
      )
    ){

      const divider=
        document.createElement("div");

      divider.className="date-divider";

      divider.textContent=
        formatDate(msg.createdAt);

      messages.appendChild(divider);

    }else if(previousTime===null){

      const divider=
        document.createElement("div");

      divider.className="date-divider";

      divider.textContent=
        formatDate(msg.createdAt);

      messages.appendChild(divider);
    }

    previousTime=
      msg.createdAt||previousTime;

    const row=
      document.createElement("div");

    row.className=
      "message-row"+
      (msg.uid===currentUser?.uid?" mine":"");

    const bubble=
      document.createElement("div");

    bubble.className="message";

    bubble.dataset.id=msg.id;

    /* Sender */
    const sender=
      document.createElement("div");

    sender.className="sender";

    sender.textContent=
      msg.uid===currentUser?.uid
        ? "You"
        : safeText(msg.name)||"Guest";

    bubble.appendChild(sender);

    /* Reply */
    if(msg.replyTo){

      const preview=
        document.createElement("div");

      preview.className="reply-preview";

      const replyN=
        document.createElement("div");

      replyN.className="reply-name";

      replyN.textContent=
        safeText(msg.replyTo.name)||
        "Guest";

      const replyT=
        document.createElement("div");

      replyT.className="reply-text";

      replyT.textContent=
        safeText(msg.replyTo.text);

      preview.appendChild(replyN);
      preview.appendChild(replyT);

      bubble.appendChild(preview);
    }

    /* Text */
    const text=
      document.createElement("div");

    text.className="message-text";

    text.textContent=
      msg.text||"";

    bubble.appendChild(text);

    /* Meta */
    const meta=
      document.createElement("div");

    meta.className="message-meta";

    const time=
      document.createElement("span");

    time.textContent=
      formatTime(msg.createdAt);

    meta.appendChild(time);

    if(msg.edited===true){

      const edited=
        document.createElement("span");

      edited.className="edited";

      edited.textContent="• edited";

      meta.appendChild(edited);
    }

    if(msg.uid===currentUser?.uid){

      const check=
        document.createElement("i");

      check.className=
        "fas fa-check";

      meta.appendChild(check);
    }

    bubble.appendChild(meta);

    row.appendChild(bubble);
    messages.appendChild(row);

    setupSwipeAndLongPress(
      bubble,
      msg
    );
  }

  if(wasNearBottom){
    requestAnimationFrame(()=>{
      messages.scrollTop=
        messages.scrollHeight;
    });
  }
}

/* ---------------------------------------------------------
   SWIPE + LONG PRESS
--------------------------------------------------------- */
function setupSwipeAndLongPress(
  element,
  msg
){

  let startX=0;
  let startY=0;

  let currentX=0;

  let moved=false;

  let longTimer=null;

  let pressing=false;

  const LONG_PRESS=600;
  const SWIPE=55;

  function clearLong(){

    if(longTimer){
      clearTimeout(longTimer);
      longTimer=null;
    }
  }

  function start(x,y){

    startX=x;
    startY=y;
    currentX=x;

    moved=false;
    pressing=true;

    clearLong();

    /* Long press ONLY own message */
    if(
      msg.uid===currentUser?.uid
    ){

      longTimer=setTimeout(()=>{

        if(
          pressing &&
          !moved
        ){
          element.style.transform="";
          openContextMenu(
            element,
            msg
          );
          tap();
        }

      },LONG_PRESS);
    }
  }

  function move(x,y){

    if(!pressing)return;

    const dx=x-startX;
    const dy=y-startY;

    if(
      Math.abs(dx)>10||
      Math.abs(dy)>10
    ){
      moved=true;
      clearLong();
    }

    /* Do not interfere with vertical scrolling */
    if(Math.abs(dy)>Math.abs(dx)){
      return;
    }

    currentX=x;

    if(Math.abs(dx)>4){

      const limited=Math.max(
        -90,
        Math.min(90,dx)
      );

      element.classList.add("swiping");

      element.style.transform=
        `translateX(${limited}px)`;
    }
  }

  function end(x,y){

    if(!pressing)return;

    pressing=false;
    clearLong();

    const dx=x-startX;
    const dy=y-startY;

    element.classList.remove(
      "swiping"
    );

    element.style.transform="";

    /* Reply to ANY message */
    if(
      Math.abs(dx)>=SWIPE &&
      Math.abs(dx)>Math.abs(dy)*1.2
    ){

      setReplyTarget(msg);
      tap();
    }
  }

  element.addEventListener(
    "touchstart",
    e=>{
      if(!e.touches[0])return;

      start(
        e.touches[0].clientX,
        e.touches[0].clientY
      );
    },
    {passive:true}
  );

  element.addEventListener(
    "touchmove",
    e=>{
      if(!e.touches[0])return;

      move(
        e.touches[0].clientX,
        e.touches[0].clientY
      );
    },
    {passive:true}
  );

  element.addEventListener(
    "touchend",
    e=>{

      const t=e.changedTouches[0];

      if(t){
        end(
          t.clientX,
          t.clientY
        );
      }else{
        pressing=false;
        clearLong();
      }
    },
    {passive:true}
  );

  element.addEventListener(
    "touchcancel",
    ()=>{
      pressing=false;
      clearLong();
      element.style.transform="";
    },
    {passive:true}
  );

  /* Desktop / WebView pointer support */
  element.addEventListener(
    "pointerdown",
    e=>{

      if(e.pointerType==="touch"){
        return;
      }

      start(
        e.clientX,
        e.clientY
      );
    }
  );

  element.addEventListener(
    "pointermove",
    e=>{

      if(e.pointerType==="touch"){
        return;
      }

      move(
        e.clientX,
        e.clientY
      );
    }
  );

  element.addEventListener(
    "pointerup",
    e=>{

      if(e.pointerType==="touch"){
        return;
      }

      end(
        e.clientX,
        e.clientY
      );
    }
  );

  element.addEventListener(
    "pointercancel",
    ()=>{
      pressing=false;
      clearLong();
      element.style.transform="";
    }
  );
}

/* ---------------------------------------------------------
   REPLY
--------------------------------------------------------- */
function setReplyTarget(msg){

  replyTarget={
    id:msg.id,
    uid:msg.uid,
    name:safeText(msg.name)||"Guest",
    text:msg.text||""
  };

  replyName.textContent=
    replyTarget.name;

  replyText.textContent=
    replyTarget.text;

  replyBar.classList.add("show");

  messageInput.focus();
}

function clearReply(){

  replyTarget=null;

  replyBar.classList.remove(
    "show"
  );

  replyName.textContent="Reply";
  replyText.textContent="";
}

/* ---------------------------------------------------------
   CONTEXT MENU
--------------------------------------------------------- */
function openContextMenu(
  element,
  msg
){

  contextMessage=msg;

  const rect=
    element.getBoundingClientRect();

  let left=rect.left;
  let top=rect.bottom+6;

  const width=165;
  const height=100;

  if(
    left+width>
    window.innerWidth-8
  ){
    left=
      window.innerWidth-width-8;
  }

  if(
    top+height>
    window.innerHeight-8
  ){
    top=rect.top-height-6;
  }

  contextMenu.style.left=
    Math.max(8,left)+"px";

  contextMenu.style.top=
    Math.max(8,top)+"px";

  contextMenu.classList.add("show");
}

function closeContextMenu(){

  contextMenu.classList.remove(
    "show"
  );

  contextMessage=null;
}

/* ---------------------------------------------------------
   EDIT
--------------------------------------------------------- */
function openEdit(msg){

  if(
    !msg||
    msg.uid!==currentUser?.uid
  ){
    return;
  }

  editingMessage=msg;

  editArea.value=msg.text||"";

  editModal.classList.add("show");

  setTimeout(()=>{
    editArea.focus();
    editArea.setSelectionRange(
      editArea.value.length,
      editArea.value.length
    );
  },50);
}

function closeEdit(){

  editModal.classList.remove(
    "show"
  );

  editingMessage=null;
}

async function saveEdit(){

  if(!editingMessage)return;

  const text=
    editArea.value.trim();

  if(!text){
    toast("Message cannot be empty");
    return;
  }

  if(
    editingMessage.uid!==
    currentUser?.uid
  ){
    closeEdit();
    return;
  }

  try{

    const msgRef=f.ref(
      db,
      "community/messages/"+
      editingMessage.id
    );

    await f.update(
      msgRef,
      {
        text:text,
        edited:true,
        editedAt:f.serverTimestamp()
      }
    );

    closeEdit();
    toast("Message edited");
    tap();

  }catch(err){

    console.error(err);

    toast("Edit failed");
  }
}

/* ---------------------------------------------------------
   DELETE
--------------------------------------------------------- */
function openDelete(msg){

  if(
    !msg||
    msg.uid!==currentUser?.uid
  ){
    return;
  }

  deletingMessage=msg;

  deleteModal.classList.add("show");
}

function closeDelete(){

  deleteModal.classList.remove(
    "show"
  );

  deletingMessage=null;
}

async function confirmDelete(){

  if(!deletingMessage)return;

  if(
    deletingMessage.uid!==
    currentUser?.uid
  ){
    closeDelete();
    return;
  }

  try{

    const msgRef=f.ref(
      db,
      "community/messages/"+
      deletingMessage.id
    );

    await f.remove(msgRef);

    closeDelete();

    toast("Message deleted");

    tap();

  }catch(err){

    console.error(err);

    toast("Delete failed");
  }
}

/* ---------------------------------------------------------
   SEND MESSAGE
--------------------------------------------------------- */
async function sendMessage(){

  if(
    !currentUser||
    !guest
  ){
    return;
  }

  const text=
    messageInput.value.trim();

  if(!text)return;

  sendBtn.disabled=true;

  try{

    const messagesRef=f.ref(
      db,
      "community/messages"
    );

    const newMessage=
      f.push(messagesRef);

    const payload={
      uid:currentUser.uid,
      name:guest.name,
      text:text,
      createdAt:f.serverTimestamp()
    };

    if(replyTarget){

      payload.replyTo={
        id:replyTarget.id,
        uid:replyTarget.uid,
        name:replyTarget.name,
        text:replyTarget.text
      };
    }

    await f.set(
      newMessage,
      payload
    );

    messageInput.value="";

    clearReply();

    tap();

    messageInput.focus();

  }catch(err){

    console.error(err);

    toast("Message could not be sent");

  }finally{

    updateSendState();
  }
}

function updateSendState(){

  sendBtn.disabled=
    !currentUser||
    !messageInput.value.trim();
}

/* ---------------------------------------------------------
   JOIN
--------------------------------------------------------- */
async function joinCommunity(){

  const name=
    guestName.value.trim();

  if(!name){

    toast("Enter your name");

    guestName.focus();

    return;
  }

  if(name.length<2){

    toast("Name is too short");

    guestName.focus();

    return;
  }

  if(name.length>30){

    toast("Name is too long");

    return;
  }

  guest=saveGuest(name);

  joinBtn.disabled=true;

  joinBtn.innerHTML=
    '<i class="fas fa-spinner fa-spin"></i> Connecting...';

  try{

    showChat();

    await login();

    toast("Welcome "+guest.name);

  }catch(err){

    console.error(err);

    guestScreen.hidden=false;
    chatShell.hidden=true;

    toast("Unable to connect");

  }finally{

    joinBtn.disabled=false;

    joinBtn.innerHTML=
      '<i class="fas fa-right-to-bracket"></i> &nbsp; Join Chat';
  }
}

      !contextMenu.contains(e.target)
    ){
      closeContextMenu();
    }
  }
);

/* Outside modals */
editModal.addEventListener(
  "click",
  e=>{
    if(e.target===editModal){
      closeEdit();
    }
  }
);

deleteModal.addEventListener(
  "click",
  e=>{
    if(e.target===deleteModal){
      closeDelete();
    }
  }
);

/* ---------------------------------------------------------
   STARTUP
--------------------------------------------------------- */
async function boot(){

  applyIndexSettings();

  const saved=readGuest();

  if(saved && saved.name){

    guest=saved;

    guestScreen.hidden=true;
    chatShell.hidden=false;

    try{

      await login();

    }catch(err){

      console.error(err);

      showGuest();

      toast("Please join again");
    }

  }else{

    showGuest();
  }
}

boot();

/* ---------------------------------------------------------
   PAGE LIFECYCLE
--------------------------------------------------------- */
window.addEventListener(
  "pagehide",
  ()=>{
    if(
      presenceRef &&
      currentUser
    ){

      try{
        f.update(
          presenceRef,
          {
            online:false,
            lastSeen:f.serverTimestamp()
          }
        );
      }catch{}
    }
  }
);

/* Keyboard viewport handling */
if(window.visualViewport){

  window.visualViewport.addEventListener(
    "resize",
    ()=>{
      requestAnimationFrame(()=>{
        messages.scrollTop=
          messages.scrollHeight;
      });
    }
  );
}
</script>
