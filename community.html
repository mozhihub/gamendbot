<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d50000">

<title>GAMEND X — Community Chat</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet"
>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --primary:#d50000;
  --primary2:#ff1744;
  --bg:#0b0e14;
  --card:#151a22;
  --card2:#10141b;
  --text:#f7f9fc;
  --muted:#a8b2c0;
  --border:#242b36;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 20% 10%,
      #d5000018,
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 20%,
      #00d9ff0d,
      transparent 30%
    ),
    var(--bg);

  color:var(--text);
  font-family:Poppins,sans-serif;

  display:flex;
  justify-content:center;

  padding:20px;
}

button,
input{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

/* =========================================================
   APP
========================================================= */

.app{
  width:min(600px,100%);
  height:calc(100vh - 40px);
  height:calc(100dvh - 40px);

  min-height:500px;

  display:flex;
  flex-direction:column;

  background:rgba(21,26,34,.94);

  border:1px solid var(--border);
  border-radius:22px;

  overflow:hidden;

  box-shadow:0 30px 80px #0008;

  position:relative;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  min-height:72px;

  padding:12px 16px;

  display:flex;
  align-items:center;

  border-bottom:1px solid var(--border);

  background:rgba(18,22,30,.9);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  position:relative;
  z-index:10;
}

.back-btn{
  width:42px;
  height:42px;

  min-width:42px;

  margin-right:10px;

  border-radius:12px;

  display:grid;
  place-items:center;

  color:#fff;

  background:#ffffff08;

  border:1px solid var(--border);

  font-size:23px;

  transition:.18s ease;
}

.back-btn:active{
  transform:scale(.92);
  background:#ffffff15;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;

  flex:1;
  min-width:0;
}

.logo{
  width:44px;
  height:44px;

  min-width:44px;

  border-radius:13px;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      var(--primary2),
      var(--primary)
    );

  color:#fff;

  font-weight:900;
  font-size:13px;
}

.brand-text{
  min-width:0;
}

.brand b{
  display:block;

  font-size:15px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brand small{
  display:block;

  color:var(--muted);

  font-size:9px;
}

.online{
  display:flex;
  align-items:center;
  gap:6px;

  color:#55e6a5;

  font-size:9px;

  white-space:nowrap;
}

.online-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#35dc91;

  box-shadow:0 0 10px #35dc91;
}

/* =========================================================
   JOIN
========================================================= */

.join{
  padding:30px 20px;

  text-align:center;

  overflow-y:auto;
}

.join-icon{
  font-size:48px;

  margin-bottom:10px;
}

.join h2{
  font-size:22px;
}

.join p{
  color:var(--muted);

  font-size:11px;
  line-height:1.7;

  margin:8px auto 18px;

  max-width:400px;
}

input{
  width:100%;
  height:46px;

  padding:0 13px;

  margin-bottom:9px;

  border-radius:12px;

  border:1px solid var(--border);

  outline:none;

  background:#10141b;

  color:var(--text);

  font-size:12px;
}

input::placeholder{
  color:#6f7988;
}

input:focus{
  border-color:var(--primary2);

  box-shadow:
    0 0 0 3px #ff174414;
}

.primary{
  width:100%;
  min-height:46px;

  border-radius:12px;

  color:#fff;

  font-weight:700;

  background:
    linear-gradient(
      135deg,
      var(--primary2),
      var(--primary)
    );

  box-shadow:0 10px 30px #d5000030;
}

.primary:disabled{
  opacity:.55;
}

.error{
  color:#ff6678;

  font-size:9px;

  margin-top:10px;

  min-height:15px;
}

/* =========================================================
   CHAT
========================================================= */

.chat{
  flex:1;

  min-height:0;

  display:flex;
  flex-direction:column;

  position:relative;
}

.messages{
  flex:1;

  min-height:0;

  overflow-y:auto;

  padding:14px;

  overscroll-behavior:contain;

  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
  width:4px;
}

.messages::-webkit-scrollbar-thumb{
  background:#ffffff18;
  border-radius:10px;
}

.empty{
  height:100%;

  display:grid;
  place-items:center;

  text-align:center;

  color:var(--muted);

  font-size:11px;

  line-height:1.7;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
  max-width:88%;

  margin:8px 0;

  position:relative;
}

.message.me{
  margin-left:auto;

  text-align:right;
}

.user{
  font-size:9px;

  font-weight:700;

  margin-bottom:3px;

  color:var(--primary2);

  padding:0 4px;
}

.bubble{
  display:inline-block;

  max-width:100%;

  padding:9px 12px;

  border-radius:13px;

  border:1px solid var(--border);

  background:#ffffff08;

  text-align:left;

  font-size:11px;

  line-height:1.5;

  word-break:break-word;

  cursor:pointer;

  transition:.15s ease;
}

.bubble:active{
  transform:scale(.985);
  background:#ffffff12;
}

.me .bubble{
  background:#d5000018;

  border-color:#d5000040;
}

.time{
  color:var(--muted);

  font-size:7px;

  margin-top:3px;

  padding:0 4px;
}

/* =========================================================
   REPLY PREVIEW INSIDE MESSAGE
========================================================= */

.reply-preview{
  display:block;

  margin-bottom:6px;

  padding:6px 8px;

  border-left:3px solid var(--primary2);

  border-radius:7px;

  background:#ffffff08;

  font-size:8px;

  color:var(--muted);

  text-align:left;

  max-width:100%;
}

.reply-preview strong{
  color:#fff;

  display:block;

  font-size:8px;

  margin-bottom:2px;
}

.reply-preview span{
  display:block;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   ACTION MENU
========================================================= */

.message-actions{
  position:fixed;

  z-index:1000;

  width:170px;

  padding:6px;

  background:#171c25;

  border:1px solid var(--border);

  border-radius:14px;

  box-shadow:
    0 20px 60px #000b;

  animation:menuIn .15s ease;

  transform-origin:top left;
}

@keyframes menuIn{
  from{
    opacity:0;
    transform:scale(.94);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

.action-btn{
  width:100%;

  height:40px;

  display:flex;

  align-items:center;

  gap:9px;

  padding:0 11px;

  border-radius:9px;

  background:transparent;

  color:#fff;

  text-align:left;

  font-size:10px;
}

.action-btn:hover{
  background:#ffffff0b;
}

.action-btn:active{
  background:#ffffff14;
}

.action-icon{
  width:25px;

  text-align:center;

  font-size:15px;
}

.menu-overlay{
  position:fixed;

  inset:0;

  z-index:999;

  background:transparent;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer-area{
  border-top:1px solid var(--border);

  background:#10141b;
}

.replying{
  display:none;

  padding:8px 10px;

  border-bottom:1px solid var(--border);

  background:#151a22;
}

.replying.show{
  display:flex;

  align-items:center;

  gap:8px;
}

.reply-line{
  width:3px;

  height:30px;

  border-radius:4px;

  background:var(--primary2);

  flex:none;
}

.reply-info{
  flex:1;

  min-width:0;
}

.reply-info strong{
  display:block;

  color:var(--primary2);

  font-size:9px;
}

.reply-info span{
  display:block;

  color:var(--muted);

  font-size:8px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.cancel-reply{
  width:30px;
  height:30px;

  border-radius:9px;

  background:#ffffff08;

  color:#fff;

  font-size:14px;
}

.composer{
  display:flex;

  gap:7px;

  padding:10px;
}

.composer input{
  flex:1;

  min-width:0;

  margin:0;

  height:46px;
}

.send{
  width:48px;
  min-width:48px;

  height:46px;

  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      var(--primary2),
      var(--primary)
    );

  color:#fff;

  font-size:17px;
}

.send:disabled{
  opacity:.5;
}

.status{
  min-height:24px;

  padding:5px 12px;

  color:var(--muted);

  font-size:8px;

  text-align:center;

  background:#10141b;
}

.leave{
  width:100%;

  padding:9px;

  color:var(--muted);

  background:none;

  font-size:9px;
}

.leave:active{
  color:#fff;
}

/* =========================================================
   HIDDEN
========================================================= */

.hidden{
  display:none!important;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  body{
    padding:0;
  }

  .app{
    width:100%;

    height:100vh;
    height:100dvh;

    min-height:0;

    border:0;

    border-radius:0;
  }

  .header{
    min-height:64px;

    padding:
      10px
      12px
      10px
      max(12px,env(safe-area-inset-left));
  }

  .messages{
    padding:10px;
  }

  .message{
    max-width:92%;
  }

  .brand b{
    font-size:14px;
  }

  .online{
    font-size:8px;
  }

  .composer-area{
    padding-bottom:
      env(safe-area-inset-bottom);
  }

  .leave{
    padding-bottom:
      max(9px,env(safe-area-inset-bottom));
  }
}

/* =========================================================
   VERY SMALL DEVICES
========================================================= */

@media(max-width:360px){

  .logo{
    width:40px;
    height:40px;
    min-width:40px;
  }

  .back-btn{
    width:38px;
    height:38px;
    min-width:38px;
  }

  .online{
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <button
      id="backBtn"
      class="back-btn"
      aria-label="Back"
      title="Back"
    >
      ←
    </button>

    <div class="brand">

      <div class="logo">
        GX
      </div>

      <div class="brand-text">

        <b>
          Community Chat
        </b>

        <small>
          GAMEND X
        </small>

      </div>

    </div>

    <div class="online">

      <span class="online-dot"></span>

      <span id="onlineCount">
        0 online
      </span>

    </div>

  </header>


  <!-- =====================================================
       JOIN
  ====================================================== -->

  <section
    id="joinBox"
    class="join"
  >

    <div class="join-icon">
      👨‍🚀
    </div>

    <h2>
      Join Community
    </h2>

    <p>
      Enter a guest name and username.
      No normal GAMEND X account is required.
    </p>

    <input
      id="name"
      maxlength="30"
      placeholder="Your name"
      autocomplete="name"
    >

    <input
      id="username"
      maxlength="20"
      placeholder="@username"
      autocomplete="username"
    >

    <button
      id="joinBtn"
      class="primary"
    >
      Join Community
    </button>

    <div
      id="error"
      class="error"
    ></div>

  </section>


  <!-- =====================================================
       CHAT
  ====================================================== -->

  <section
    id="chatBox"
    class="chat hidden"
  >

    <div
      id="messages"
      class="messages"
    >

      <div class="empty">
        Loading messages…
      </div>

    </div>


    <!-- STATUS -->

    <div
      id="status"
      class="status"
    >
      Connecting…
    </div>


    <!-- COMPOSER -->

    <div class="composer-area">

      <!-- REPLY PREVIEW -->

      <div
        id="replying"
        class="replying"
      >

        <div class="reply-line"></div>

        <div class="reply-info">

          <strong id="replyName">
            Replying
          </strong>

          <span id="replyText">
            Message
          </span>

        </div>

        <button
          id="cancelReply"
          class="cancel-reply"
          aria-label="Cancel reply"
        >
          ×
        </button>

      </div>


      <div class="composer">

        <input
          id="messageInput"
          maxlength="500"
          placeholder="Write a message…"
          autocomplete="off"
        >

        <button
          id="sendBtn"
          class="send"
          aria-label="Send message"
        >
          ➤
        </button>

      </div>

    </div>


    <button
      id="leaveBtn"
      class="leave"
    >
      Leave guest profile
    </button>

  </section>

</div>


<!-- =========================================================
     FIREBASE
========================================================= -->

<script type="module">

import {
  initializeApp,
  getApps,
  getApp
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  onDisconnect,
  serverTimestamp,
  query,
  orderByChild,
  limitToLast
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCaALqxdtEPCNxg5XPPG81T9853gOPO4qY",

  authDomain:
    "server-41203.firebaseapp.com",

  databaseURL:
    "https://server-41203-default-rtdb.firebaseio.com",

  projectId:
    "server-41203",

  storageBucket:
    "server-41203.firebasestorage.app",

  messagingSenderId:
    "26278139327",

  appId:
    "1:26278139327:web:db44a7e2d8d42d690abd0a"

};


/* =========================================================
   FIREBASE INIT
========================================================= */

const app =
  getApps().length
    ? getApp()
    : initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getDatabase(app);


/* =========================================================
   DOM
========================================================= */

const backBtn =
  document.getElementById("backBtn");

const joinBox =
  document.getElementById("joinBox");

const chatBox =
  document.getElementById("chatBox");

const nameInput =
  document.getElementById("name");

const usernameInput =
  document.getElementById("username");

const joinBtn =
  document.getElementById("joinBtn");

const messagesBox =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const errorBox =
  document.getElementById("error");

const statusBox =
  document.getElementById("status");

const onlineCount =
  document.getElementById("onlineCount");

const leaveBtn =
  document.getElementById("leaveBtn");

const replying =
  document.getElementById("replying");

const replyName =
  document.getElementById("replyName");

const replyText =
  document.getElementById("replyText");

const cancelReply =
  document.getElementById("cancelReply");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let profile = null;

let messagesUnsubscribe = null;

let presenceUnsubscribe = null;

let sending = false;

let activeReply = null;

let actionMenu = null;

let menuOverlay = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  return String(value ?? "")

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


function setStatus(text){

  statusBox.textContent =
    text;

}


function getStoredProfile(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "gamend_guest"
      )
    );

  }catch{

    return null;

  }

}


function saveProfile(data){

  localStorage.setItem(
    "gamend_guest",
    JSON.stringify(data)
  );

}


function clearProfile(){

  localStorage.removeItem(
    "gamend_guest"
  );

}


/* =========================================================
   BACK TO INDEX
========================================================= */

function goBack(){

  /*
    Always return to GAMEND X main page.
  */

  window.location.href =
    "index.html";

}


backBtn.addEventListener(
  "click",
  goBack
);


/* =========================================================
   AUTH
========================================================= */

async function authenticate(){

  if(auth.currentUser){

    currentUser =
      auth.currentUser;

    return currentUser;

  }


  setStatus(
    "Connecting to Firebase…"
  );


  const result =
    await signInAnonymously(auth);


  currentUser =
    result.user;


  return currentUser;

}


/* =========================================================
   JOIN COMMUNITY
========================================================= */

async function joinCommunity(){

  errorBox.textContent = "";


  const name =
    nameInput.value.trim();


  let username =
    usernameInput.value.trim();


  if(name.length < 2){

    errorBox.textContent =
      "Enter a valid name.";

    return;

  }


  if(username.startsWith("@")){

    username =
      username.substring(1);

  }


  if(
    !/^[A-Za-z0-9_]{3,20}$/
      .test(username)
  ){

    errorBox.textContent =
      "Username must contain 3–20 letters, numbers or _.";

    return;

  }


  joinBtn.disabled =
    true;

  joinBtn.textContent =
    "Connecting…";


  try{

    const user =
      await authenticate();


    profile = {

      name:name,

      username:
        "@" + username,

      uid:
        user.uid

    };


    saveProfile(
      profile
    );


    joinBox.classList.add(
      "hidden"
    );

    chatBox.classList.remove(
      "hidden"
    );


    await startPresence();

    startMessages();


    messageInput.focus();


  }catch(error){

    console.error(error);


    errorBox.textContent =
      error?.message ||
      "Firebase connection failed.";

  }finally{

    joinBtn.disabled =
      false;

    joinBtn.textContent =
      "Join Community";

  }

}


/* =========================================================
   PRESENCE
========================================================= */

async function startPresence(){

  if(!currentUser)
    return;


  const presenceRef =
    ref(
      db,
      "community/presence/" +
      currentUser.uid
    );


  await set(
    presenceRef,
    {

      uid:
        currentUser.uid,

      name:
        profile.name,

      username:
        profile.username,

      online:
        true,

      lastSeen:
        serverTimestamp()

    }
  );


  await onDisconnect(
    presenceRef
  ).update({

    online:false,

    lastSeen:
      serverTimestamp()

  });


  if(presenceUnsubscribe){

    presenceUnsubscribe();

  }


  const presenceRoot =
    ref(
      db,
      "community/presence"
    );


  presenceUnsubscribe =
    onValue(

      presenceRoot,

      snapshot => {

        let count = 0;


        snapshot.forEach(
          child => {

            const value =
              child.val();


            if(
              value &&
              value.online === true
            ){

              count++;

            }

          }
        );


        onlineCount.textContent =
          count +
          (
            count === 1
              ? " online"
              : " online"
          );

      },

      error => {

        console.error(error);

        onlineCount.textContent =
          "— online";

      }

    );

}


/* =========================================================
   REALTIME MESSAGES
========================================================= */

function startMessages(){

  if(messagesUnsubscribe){

    messagesUnsubscribe();

  }


  const messagesRef =
    ref(
      db,
      "community/messages"
    );


  const messagesQuery =
    query(

      messagesRef,

      orderByChild(
        "createdAt"
      ),

      limitToLast(100)

    );


  setStatus(
    "Connected • Live chat"
  );


  messagesUnsubscribe =
    onValue(

      messagesQuery,

      snapshot => {

        const list = [];


        snapshot.forEach(
          child => {

            const data =
              child.val();


            if(data){

              list.push({

                id:
                  child.key,

                ...data

              });

            }

          }
        );


        renderMessages(
          list
        );

      },

      error => {

        console.error(
          "Message listener error:",
          error
        );


        setStatus(
          "Unable to read messages: " +
          error.message
        );

      }

    );

}


/* =========================================================
   FORMAT MESSAGE TIME
========================================================= */

function formatTime(
  timestamp
){

  if(!timestamp){

    return "now";

  }


  try{

    return new Date(
      timestamp
    ).toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch{

    return "now";

  }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(list){

  if(!list.length){

    messagesBox.innerHTML = `

      <div class="empty">

        No messages yet.<br>

        Be the first to say hello 👋

      </div>

    `;

    return;

  }


  messagesBox.innerHTML =
    list.map(
      message => {

        const mine =
          message.uid ===
          currentUser?.uid;


        const replied =
          message.replyTo;


        const replyHTML =
          replied

            ? `

              <div class="reply-preview">

                <strong>
                  ${escapeHTML(
                    replied.name ||
                    "Guest"
                  )}
                </strong>

                <span>
                  ${escapeHTML(
                    replied.text ||
                    ""
                  )}
                </span>

              </div>

            `

            : "";


        return `

          <div
            class="message ${mine ? "me" : ""}"
            data-message-id="${escapeHTML(
              message.id
            )}"
          >

            <div class="user">

              ${escapeHTML(
                message.name ||
                "Guest"
              )}

              ${escapeHTML(
                message.username ||
                ""
              )}

            </div>


            <div
              class="bubble"
              data-action-message="${escapeHTML(
                message.id
              )}"
            >

              ${replyHTML}

              ${escapeHTML(
                message.text ||
                ""
              )}

            </div>


            <div class="time">

              ${escapeHTML(
                formatTime(
                  message.createdAt
                )
              )}

            </div>

          </div>

        `;

      }
    ).join("");


  /*
    Store current messages in DOM
    for reply/tag actions.
  */

  messagesBox
    .querySelectorAll(
      "[data-action-message]"
    )
    .forEach(
      element => {

        element.addEventListener(
          "click",
          event => {

            event.stopPropagation();


            const messageId =
              element.dataset
                .actionMessage;


            const selected =
              list.find(
                item =>
                  item.id ===
                  messageId
              );


            if(selected){

              showMessageMenu(
                selected,
                element
              );

            }

          }
        );

      }
    );


  messagesBox.scrollTop =
    messagesBox.scrollHeight;

}


/* =========================================================
   CLOSE ACTION MENU
========================================================= */

function closeMessageMenu(){

  if(actionMenu){

    actionMenu.remove();

    actionMenu =
      null;

  }


  if(menuOverlay){

    menuOverlay.remove();

    menuOverlay =
      null;

  }

}


/* =========================================================
   SHOW MESSAGE MENU
========================================================= */

function showMessageMenu(
  message,
  bubbleElement
){

  closeMessageMenu();


  menuOverlay =
    document.createElement(
      "div"
    );


  menuOverlay.className =
    "menu-overlay";


  menuOverlay.addEventListener(
    "click",
    closeMessageMenu
  );


  document.body.appendChild(
    menuOverlay
  );


  actionMenu =
    document.createElement(
      "div"
    );


  actionMenu.className =
    "message-actions";


  actionMenu.innerHTML = `

    <button
      class="action-btn"
      id="replyAction"
    >

      <span class="action-icon">
        ↩
      </span>

      <span>
        Reply
      </span>

    </button>


    <button
      class="action-btn"
      id="tagAction"
    >

      <span class="action-icon">
        @
      </span>

      <span>
        Tag ${escapeHTML(
          message.username ||
          "@user"
        )}
      </span>

    </button>

  `;


  document.body.appendChild(
    actionMenu
  );


  const rect =
    bubbleElement.getBoundingClientRect();


  const menuWidth =
    170;

  const menuHeight =
    94;


  let left =
    rect.left;


  let top =
    rect.bottom + 6;


  if(
    left + menuWidth >
    window.innerWidth - 8
  ){

    left =
      window.innerWidth -
      menuWidth -
      8;

  }


  if(
    top + menuHeight >
    window.innerHeight - 8
  ){

    top =
      rect.top -
      menuHeight -
      6;

  }


  if(top < 8){

    top = 8;

  }


  if(left < 8){

    left = 8;

  }


  actionMenu.style.left =
    left + "px";


  actionMenu.style.top =
    top + "px";


  document
    .getElementById(
      "replyAction"
    )
    .addEventListener(
      "click",
      event => {

        event.stopPropagation();

        startReply(
          message
        );

        closeMessageMenu();

      }
    );


  document
    .getElementById(
      "tagAction"
    )
    .addEventListener(
      "click",
      event => {

        event.stopPropagation();

        tagUser(
          message
        );

        closeMessageMenu();

      }
    );

}


/* =========================================================
   START REPLY
========================================================= */

function startReply(
  message
){

  activeReply = {

    id:
      message.id,

    uid:
      message.uid ||
      "",

    name:
      message.name ||
      "Guest",

    username:
      message.username ||
      "",

    text:
      message.text ||
      ""

  };


  replyName.textContent =
    "Replying to " +
    (
      message.username ||
      message.name ||
      "Guest"
    );


  replyText.textContent =
    message.text ||
    "";


  replying.classList.add(
    "show"
  );


  messageInput.focus();


  setStatus(
    "Reply mode • Live chat"
  );

}


/* =========================================================
   CANCEL REPLY
========================================================= */

function cancelActiveReply(){

  activeReply =
    null;


  replying.classList.remove(
    "show"
  );


  setStatus(
    "Connected • Live chat"
  );


  messageInput.focus();

}


cancelReply.addEventListener(
  "click",
  cancelActiveReply
);


/* =========================================================
   TAG USER
========================================================= */

function tagUser(
  message
){

  const username =
    message.username ||
    (
      message.name
        ? "@" +
          message.name
            .replace(
              /\s+/g,
              ""
            )
        : "@user"
    );


  const current =
    messageInput.value;


  const tag =
    username + " ";


  /*
    If there is already text,
    put tag at beginning.
  */

  if(current.trim()){

    messageInput.value =
      tag +
      current;

  }else{

    messageInput.value =
      tag;

  }


  messageInput.focus();


  /*
    Put cursor at end.
  */

  messageInput.selectionStart =
    messageInput.value.length;

  messageInput.selectionEnd =
    messageInput.value.length;


  setStatus(
    "Tagged " +
    username
  );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(sending)
    return;


  const text =
    messageInput.value.trim();


  if(!text)
    return;


  if(
    !currentUser ||
    !profile
  ){

    setStatus(
      "Join the community first."
    );

    return;

  }


  sending =
    true;


  sendBtn.disabled =
    true;


  sendBtn.textContent =
    "…";


  try{

    const messagesRef =
      ref(
        db,
        "community/messages"
      );


    const messageData = {

      uid:
        currentUser.uid,

      name:
        profile.name,

      username:
        profile.username,

      text:
        text.slice(0,500),

      createdAt:
        serverTimestamp()

    };


    /*
      Add reply information
      only when replying.
    */

    if(activeReply){

      messageData.replyTo = {

        id:
          activeReply.id,

        uid:
          activeReply.uid,

        name:
          activeReply.name,

        username:
          activeReply.username,

        text:
          activeReply.text
            .slice(0,200)

      };

    }


    await push(
      messagesRef,
      messageData
    );


    messageInput.value =
      "";


    activeReply =
      null;


    replying.classList.remove(
      "show"
    );


    setStatus(
      "Message sent • Live chat"
    );


    messageInput.focus();


  }catch(error){

    console.error(
      "Send message error:",
      error
    );


    setStatus(
      "Message failed: " +
      error.message
    );

  }finally{

    sending =
      false;


    sendBtn.disabled =
      false;


    sendBtn.textContent =
      "➤";

  }

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

joinBtn.addEventListener(
  "click",
  joinCommunity
);


sendBtn.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   LEAVE COMMUNITY
========================================================= */

async function leaveCommunity(){

  try{

    if(currentUser){

      const presenceRef =
        ref(
          db,
          "community/presence/" +
          currentUser.uid
        );


      await set(
        presenceRef,
        {

          uid:
            currentUser.uid,

          name:
            profile?.name ||
            "Guest",

          username:
            profile?.username ||
            "",

          online:false,

          lastSeen:
            serverTimestamp()

        }
      );

    }

  }catch(error){

    console.warn(error);

  }


  if(messagesUnsubscribe){

    messagesUnsubscribe();

    messagesUnsubscribe =
      null;

  }


  if(presenceUnsubscribe){

    presenceUnsubscribe();

    presenceUnsubscribe =
      null;

  }


  closeMessageMenu();


  clearProfile();


  profile =
    null;


  activeReply =
    null;


  replying.classList.remove(
    "show"
  );


  joinBox.classList.remove(
    "hidden"
  );


  chatBox.classList.add(
    "hidden"
  );


  messageInput.value =
    "";


  setStatus(
    "Disconnected"
  );

}


leaveBtn.addEventListener(
  "click",
  leaveCommunity
);


/* =========================================================
   AUTO LOGIN
========================================================= */

async function autoJoin(){

  const stored =
    getStoredProfile();


  if(
    !stored?.name ||
    !stored?.username
  ){

    return;

  }


  nameInput.value =
    stored.name;


  usernameInput.value =
    stored.username;


  try{

    const user =
      await authenticate();


    profile = {

      name:
        stored.name,

      username:
        stored.username,

      uid:
        user.uid

    };


    saveProfile(
      profile
    );


    joinBox.classList.add(
      "hidden"
    );


    chatBox.classList.remove(
      "hidden"
    );


    await startPresence();

    startMessages();


  }catch(error){

    console.warn(
      "Auto join failed:",
      error
    );


    clearProfile();

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  user => {

    currentUser =
      user;

  }
);


/* =========================================================
   START
========================================================= */

autoJoin();


/* =========================================================
   PAGE EXIT
========================================================= */

window.addEventListener(
  "pagehide",
  () => {

    if(currentUser){

      const presenceRef =
        ref(
          db,
          "community/presence/" +
          currentUser.uid
        );


      set(
        presenceRef,
        {

          uid:
            currentUser.uid,

          name:
            profile?.name ||
            "Guest",

          username:
            profile?.username ||
            "",

          online:false,

          lastSeen:
            serverTimestamp()

        }
      ).catch(
        () => {}
      );

    }

  }
);


/* =========================================================
   CLOSE MENU ON SCROLL
========================================================= */

messagesBox.addEventListener(
  "scroll",
  () => {

    closeMessageMenu();

  },
  {
    passive:true
  }
);


/* =========================================================
   CLOSE MENU ON RESIZE
========================================================= */

window.addEventListener(
  "resize",
  () => {

    closeMessageMenu();

  }
);

</script>
