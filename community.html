<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#d50000">

<title>GAMEND X — Community</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --primary:#d50000;
  --primary2:#ff1744;
  --bg:#080b10;
  --header:#11151d;
  --card:#151a22;
  --card2:#10141b;
  --text:#f7f9fc;
  --muted:#9ca7b5;
  --border:#252c37;
  --green:#35dc91;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:
    radial-gradient(
      circle at 15% 5%,
      rgba(213,0,0,.13),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(0,210,255,.05),
      transparent 30%
    ),
    var(--bg);

  color:var(--text);
  font-family:Poppins,sans-serif;
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  border:0;
  outline:none;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   APP
========================= */

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================
   HEADER
========================= */

.header{
  height:68px;
  min-height:68px;

  display:flex;
  align-items:center;
  gap:10px;

  padding:
    calc(8px + env(safe-area-inset-top))
    12px
    8px
    12px;

  background:rgba(15,18,25,.96);
  border-bottom:1px solid var(--border);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  z-index:20;
}

.back-btn{
  width:42px;
  height:42px;
  min-width:42px;

  border-radius:13px;

  display:grid;
  place-items:center;

  background:#ffffff08;
  border:1px solid var(--border);

  color:#fff;
  font-size:23px;

  transition:.15s;
}

.back-btn:active{
  transform:scale(.92);
  background:#ffffff12;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  flex:1;
}

.logo{
  width:42px;
  height:42px;
  min-width:42px;

  border-radius:13px;

  display:grid;
  place-items:center;

  color:#fff;
  font-size:13px;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--primary2),
      var(--primary)
    );

  box-shadow:
    0 8px 25px rgba(213,0,0,.28);
}

.brand-text{
  min-width:0;
}

.brand-title{
  display:block;

  font-size:14px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brand-sub{
  display:block;

  color:var(--muted);
  font-size:8px;

  margin-top:1px;
}

.online{
  display:flex;
  align-items:center;
  gap:5px;

  color:var(--green);
  font-size:8px;
  font-weight:600;

  white-space:nowrap;
}

.online-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 10px var(--green);

  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:1;
  }
  50%{
    opacity:.45;
  }
}

/* =========================
   JOIN
========================= */

.join{
  width:100%;
  max-width:480px;

  margin:auto;

  padding:25px;

  text-align:center;
}

.join-icon{
  font-size:50px;
  margin-bottom:8px;
}

.join h2{
  font-size:23px;
  font-weight:800;
}

.join p{
  color:var(--muted);
  font-size:10px;
  line-height:1.7;

  margin:
    7px auto
    18px;

  max-width:380px;
}

.input{
  width:100%;
  height:48px;

  padding:0 14px;
  margin-bottom:9px;

  color:var(--text);
  background:#10141b;

  border:
    1px solid var(--border);

  border-radius:13px;

  outline:none;

  font-size:12px;
}

.input:focus{
  border-color:var(--primary2);
}

.primary-btn{
  width:100%;
  height:48px;

  border-radius:13px;

  color:#fff;

  font-size:12px;
  font-weight:800;

  background:
    linear-gradient(
      135deg,
      var(--primary2),
      var(--primary)
    );

  box-shadow:
    0 10px 30px rgba(213,0,0,.22);
}

.primary-btn:disabled{
  opacity:.55;
}

.error{
  min-height:17px;

  color:#ff6475;

  font-size:9px;

  margin-top:8px;
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;
  min-height:0;

  display:flex;
  flex-direction:column;
}

/* =========================
   MESSAGES
========================= */

.messages{
  flex:1;
  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  padding:
    12px
    10px
    14px;

  scroll-behavior:smooth;

  overscroll-behavior:contain;
}

.messages::-webkit-scrollbar{
  width:3px;
}

.messages::-webkit-scrollbar-thumb{
  background:#ffffff18;
  border-radius:20px;
}

.empty{
  height:100%;

  display:grid;
  place-items:center;

  text-align:center;

  color:var(--muted);

  font-size:10px;
}

/* =========================
   MESSAGE ROW
========================= */

.message-wrap{
  position:relative;

  width:100%;

  margin:
    5px 0;

  touch-action:pan-y;
}

.message{
  position:relative;

  max-width:88%;

  display:flex;
  flex-direction:column;

  transition:
    transform .18s ease;
}

.message.me{
  margin-left:auto;
  align-items:flex-end;
}

.message.other{
  align-items:flex-start;
}

.user{
  margin-bottom:3px;

  color:var(--primary2);

  font-size:8px;
  font-weight:800;

  user-select:none;
}

.other .user{
  color:#b8c1ce;
}

.bubble{
  position:relative;

  max-width:100%;

  padding:
    9px
    12px;

  color:var(--text);

  background:#ffffff08;

  border:
    1px solid var(--border);

  border-radius:14px;

  text-align:left;

  font-size:11px;
  line-height:1.55;

  word-break:break-word;

  user-select:text;
}

.me .bubble{
  background:
    linear-gradient(
      135deg,
      rgba(213,0,0,.22),
      rgba(213,0,0,.08)
    );

  border-color:#d5000040;
}

.reply-box{
  width:100%;

  margin-bottom:5px;

  padding:
    6px 8px;

  border-left:
    3px solid var(--primary2);

  border-radius:7px;

  background:#ffffff08;

  font-size:8px;

  color:var(--muted);

  overflow:hidden;
}

.reply-box strong{
  display:block;

  color:#ff6475;

  font-size:8px;

  margin-bottom:2px;
}

.reply-box span{
  display:block;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.edited{
  color:var(--muted);

  font-size:7px;
  margin-left:3px;
}

.time{
  color:#687384;

  font-size:7px;

  margin-top:3px;

  user-select:none;
}

/* =========================
   SWIPE REPLY ICON
========================= */

.reply-action{
  position:absolute;

  top:50%;

  width:34px;
  height:34px;

  margin-top:-17px;

  border-radius:50%;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      var(--primary2),
      var(--primary)
    );

  color:#fff;

  font-size:16px;

  opacity:0;

  transform:scale(.6);

  transition:.15s;

  pointer-events:none;

  box-shadow:
    0 6px 20px rgba(213,0,0,.3);
}

.reply-action.left{
  right:5px;
}

.reply-action.right{
  left:5px;
}

.message-wrap.replying .reply-action{
  opacity:1;
  transform:scale(1);
}

/* =========================
   REPLY PREVIEW
========================= */

.reply-preview{
  display:flex;
  align-items:center;
  gap:8px;

  min-height:48px;

  padding:
    7px
    10px;

  background:#121720;

  border-top:
    1px solid var(--border);

  border-bottom:
    1px solid var(--border);
}

.reply-preview-line{
  width:3px;
  height:32px;

  min-width:3px;

  border-radius:5px;

  background:
    linear-gradient(
      var(--primary2),
      var(--primary)
    );
}

.reply-preview-content{
  min-width:0;
  flex:1;
}

.reply-preview-name{
  color:#ff6475;

  font-size:8px;
  font-weight:800;
}

.reply-preview-text{
  color:var(--muted);

  font-size:8px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.cancel-reply{
  width:30px;
  height:30px;

  border-radius:50%;

  background:#ffffff08;

  color:#fff;

  font-size:17px;
}

/* =========================
   COMPOSER
========================= */

.composer{
  display:flex;
  align-items:center;
  gap:7px;

  padding:
    8px 9px
    calc(8px + env(safe-area-inset-bottom));

  background:#10141b;

  border-top:
    1px solid var(--border);
}

.message-input{
  flex:1;

  width:100%;
  height:45px;

  padding:
    0 13px;

  border-radius:13px;

  border:
    1px solid var(--border);

  background:#151a22;

  color:#fff;

  outline:none;

  font-size:11px;
}

.message-input:focus{
  border-color:var(--primary2);
}

.send{
  width:45px;
  height:45px;

  min-width:45px;

  border-radius:13px;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      var(--primary2),
      var(--primary)
    );

  color:#fff;

  font-size:17px;

  box-shadow:
    0 7px 22px rgba(213,0,0,.2);
}

.send:disabled{
  opacity:.45;
}

/* =========================
   STATUS / LEAVE
========================= */

.status{
  min-height:20px;

  padding:
    3px 10px;

  color:#7e8998;

  font-size:7px;

  text-align:center;

  background:#0e1218;
}

.leave{
  width:100%;

  height:28px;

  background:#0e1218;

  color:#687384;

  font-size:8px;
}

/* =========================
   CONTEXT MENU
========================= */

.context-menu{
  position:fixed;

  z-index:1000;

  min-width:150px;

  padding:5px;

  border-radius:15px;

  background:#171c25;

  border:1px solid var(--border);

  box-shadow:
    0 18px 50px rgba(0,0,0,.55);

  animation:menuIn .12s ease;
}

@keyframes menuIn{
  from{
    opacity:0;
    transform:scale(.94);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.context-title{
  padding:
    7px 9px;

  color:#758092;

  font-size:7px;
  font-weight:700;
}

.menu-btn{
  width:100%;

  height:38px;

  display:flex;
  align-items:center;

  gap:9px;

  padding:
    0 10px;

  border-radius:10px;

  background:transparent;

  color:#fff;

  font-size:10px;

  text-align:left;
}

.menu-btn:active{
  background:#ffffff0d;
}

.menu-btn.delete{
  color:#ff6475;
}

/* =========================
   EDIT MODAL
========================= */

.modal{
  position:fixed;

  inset:0;

  z-index:2000;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.72);

  backdrop-filter:blur(8px);
}

.modal-card{
  width:min(430px,100%);

  padding:17px;

  border-radius:20px;

  background:#151a22;

  border:
    1px solid var(--border);

  box-shadow:
    0 30px 80px rgba(0,0,0,.55);
}

.modal-title{
  font-size:15px;
  font-weight:800;

  margin-bottom:11px;
}

.edit-textarea{
  width:100%;

  min-height:120px;

  resize:none;

  padding:11px;

  border-radius:13px;

  border:
    1px solid var(--border);

  background:#10141b;

  color:#fff;

  outline:none;

  font-size:11px;
  line-height:1.5;
}

.edit-textarea:focus{
  border-color:var(--primary2);
}

.modal-buttons{
  display:flex;
  gap:8px;

  margin-top:10px;
}

.modal-btn{
  flex:1;

  height:43px;

  border-radius:12px;

  font-size:10px;
  font-weight:700;
}

.cancel-btn{
  background:#ffffff08;
  color:#fff;

  border:
    1px solid var(--border);
}

.done-btn{
  background:
    linear-gradient(
      135deg,
      var(--primary2),
      var(--primary)
    );

  color:#fff;
}

/* =========================
   CONFIRM MODAL
========================= */

.confirm-text{
  color:var(--muted);

  font-size:10px;

  line-height:1.6;

  margin-bottom:12px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  left:50%;
  bottom:
    calc(78px + env(safe-area-inset-bottom));

  z-index:3000;

  transform:
    translateX(-50%)
    translateY(20px);

  padding:
    9px 14px;

  border-radius:12px;

  background:#191f29;

  border:
    1px solid var(--border);

  color:#fff;

  font-size:9px;

  opacity:0;
  pointer-events:none;

  transition:.2s;

  white-space:nowrap;

  box-shadow:
    0 10px 30px rgba(0,0,0,.4);
}

.toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================
   DESKTOP
========================= */

@media(min-width:601px){

  body{
    padding:20px;
  }

  .app{
    max-width:600px;
    height:calc(100dvh - 40px);

    margin:auto;

    border:
      1px solid var(--border);

    border-radius:22px;

    box-shadow:
      0 30px 90px rgba(0,0,0,.5);
  }

  .header{
    border-radius:
      22px 22px 0 0;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <button
      id="backBtn"
      class="back-btn"
      aria-label="Back">
      ‹
    </button>

    <div class="brand">

      <div class="logo">
        GX
      </div>

      <div class="brand-text">

        <span class="brand-title">
          Community Chat
        </span>

        <span class="brand-sub">
          GAMEND X • LIVE COMMUNITY
        </span>

      </div>

    </div>

    <div class="online">

      <span class="online-dot"></span>

      <span id="onlineCount">
        0 online
      </span>

    </div>

  </header>


  <!-- JOIN -->
  <section
    id="joinBox"
    class="join">

    <div class="join-icon">
      👨‍🚀
    </div>

    <h2>
      Join Community
    </h2>

    <p>
      Enter your guest name and username
      to join the GAMEND X community.
    </p>

    <input
      id="name"
      class="input"
      maxlength="30"
      placeholder="Your name"

    <input
      id="username"
      class="input"

      placeholder="@username"
      autocomplete="username">

    <button
      id="joinBtn"
      class="primary-btn">
      Join Community
    </button>

    <div
      id="error"
      class="error">
    </div>

  </section>


  <!-- CHAT -->
  <section
    id="chatBox"
    class="chat hidden">

    <div
      id="messages"
      class="messages">

      <div class="empty">
        Loading messages…
      </div>

    </div>


    <div
      id="replyPreview"
      class="reply-preview hidden">

      <div class="reply-preview-line"></div>

      <div class="reply-preview-content">

        <div
          id="replyPreviewName"
          class="reply-preview-name">
        </div>

        <div
          id="replyPreviewText"
          class="reply-preview-text">
        </div>

      </div>

      <button
        id="cancelReply"
        class="cancel-reply">
        ×
      </button>

    </div>


    <div
      id="status"
      class="status">
      Connecting…
    </div>


    <div class="composer">

      <input
        id="messageInput"
        class="message-input"
        maxlength="500"
        placeholder="Write a message…"
        autocomplete="off">

      <button
        id="sendBtn"
        class="send"
        aria-label="Send">
        ➤
      </button>

    </div>


    <button
      id="leaveBtn"
      class="leave">
      Leave guest profile
    </button>

  </section>

</div>


<!-- CONTEXT MENU -->

<div
  id="contextMenu"
  class="context-menu hidden">

  <div class="context-title">
    YOUR MESSAGE
  </div>

  <button
    id="editMenuBtn"
    class="menu-btn">
    ✏️ Edit message
  </button>

  <button
    id="deleteMenuBtn"
    class="menu-btn delete">
    🗑️ Delete message
  </button>

</div>


<!-- EDIT MODAL -->

<div
  id="editModal"
  class="modal hidden">

  <div class="modal-card">

    <div class="modal-title">
      Edit Message
    </div>

    <textarea
      id="editTextarea"
      class="edit-textarea"
      maxlength="500"></textarea>

    <div class="modal-buttons">

      <button
        id="editCancel"
        class="modal-btn cancel-btn">
        Cancel
      </button>

      <button
        id="editDone"
        class="modal-btn done-btn">
        Done
      </button>

    </div>

  </div>

</div>


<!-- DELETE MODAL -->

<div
  id="deleteModal"
  class="modal hidden">

  <div class="modal-card">

    <div class="modal-title">
      Delete Message?
    </div>

    <div class="confirm-text">
      Are you sure you want to permanently
      delete this message?
    </div>

    <div class="modal-buttons">

      <button
        id="deleteCancel"
        class="modal-btn cancel-btn">
        Cancel
      </button>

      <button
        id="deleteConfirm"
        class="modal-btn done-btn">
        Delete
      </button>

    </div>

  </div>

</div>


<div
  id="toast"
  class="toast">
</div>

/* =====================================================

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function setStatus(text){

  statusBox.textContent =
    text;
}


function showToast(text){

  clearTimeout(toastTimer);

  toast.textContent =
    text;

  toast.classList.add("show");

  toastTimer =
    setTimeout(
      () => {
        toast.classList.remove("show");
      },
      2200
    );
}


function getStoredProfile(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "gamend_guest"
      )
    );

  }catch{

    return null;

  }
}


function saveProfile(data){

  localStorage.setItem(
    "gamend_guest",
    JSON.stringify(data)
  );
}


function clearProfile(){

  localStorage.removeItem(
    "gamend_guest"
  );
}


/* =====================================================
   AUTH
===================================================== */

async function authenticate(){

  if(auth.currentUser){

    currentUser =
      auth.currentUser;

    return currentUser;
  }

  setStatus(
    "Connecting to Firebase…"
  );

  const result =
    await signInAnonymously(auth);

  currentUser =
    result.user;

  return currentUser;
}


/* =====================================================
   JOIN COMMUNITY
===================================================== */

async function joinCommunity(){

  errorBox.textContent =
    "";

  const name =
    nameInput.value.trim();

  let username =
    usernameInput.value.trim();

  if(name.length < 2){

    errorBox.textContent =
      "Enter a valid name.";

    return;
  }

  if(username.startsWith("@")){

    username =
      username.substring(1);
  }

  if(
    !/^[A-Za-z0-9_]{3,20}$/
      .test(username)
  ){

    errorBox.textContent =
      "Username must contain 3–20 letters, numbers or _.";

    return;
  }

  joinBtn.disabled =
    true;

  joinBtn.textContent =
    "Connecting…";

  try{

    const user =
      await authenticate();

    profile = {

      name:
        name,

      username:
        "@" + username,

      uid:
        user.uid

    };

    saveProfile(profile);

    joinBox.classList.add(
      "hidden"
    );

    chatBox.classList.remove(
      "hidden"
    );

    await startPresence();

    startMessages();

    messageInput.focus();

  }catch(error){

    console.error(error);

    errorBox.textContent =
      error?.message ||
      "Firebase connection failed.";

  }finally{

    joinBtn.disabled =
      false;

    joinBtn.textContent =
      "Join Community";

  }
}


/* =====================================================
   PRESENCE
===================================================== */

async function startPresence(){

  if(!currentUser)
    return;

  const presenceRef =
    ref(
      db,
      "community/presence/" +
      currentUser.uid
    );

  await set(
    presenceRef,
    {
      uid:
        currentUser.uid,

      name:
        profile.name,

      username:
        profile.username,

      online:
        true,

      lastSeen:
        serverTimestamp()
    }
  );

  await onDisconnect(
    presenceRef
  ).update({

    online:
      false,

    lastSeen:
      serverTimestamp()

  });


  if(presenceUnsubscribe){

    presenceUnsubscribe();

  }


  const presenceRoot =
    ref(
      db,
      "community/presence"
    );


  presenceUnsubscribe =
    onValue(
      presenceRoot,

      snapshot => {

        let count =
          0;

        snapshot.forEach(
          child => {

            const value =
              child.val();

            if(
              value &&
              value.online === true
            ){

              count++;

            }

          }
        );

        onlineCount.textContent =
          count +
          (
            count === 1
              ? " online"
              : " online"
          );

      },

      error => {

        console.error(
          "Presence error:",
          error
        );

        onlineCount.textContent =
          "— online";

      }
    );
}


/* =====================================================
   MESSAGES LISTENER
===================================================== */

function startMessages(){

  if(messagesUnsubscribe){

    messagesUnsubscribe();

  }


  const messagesRef =
    ref(
      db,
      "community/messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderByChild("createdAt"),
      limitToLast(100)
    );


  setStatus(
    "Connected • Live chat"
  );


  messagesUnsubscribe =
    onValue(

      messagesQuery,

      snapshot => {

        const list =
          [];

        snapshot.forEach(
          child => {

            const data =
              child.val();

            if(data){

              list.push({

                id:
                  child.key,

                ...data

              });

            }

          }
        );

        messages =
          list;

        renderMessages(
          list
        );

      },

      error => {

        console.error(
          error
        );

        setStatus(
          "Unable to read messages"
        );

      }

    );
}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(list){

  if(!list.length){

    messagesBox.innerHTML = `
      <div class="empty">
        No messages yet.<br>
        Be the first to say hello 👋
      </div>
    `;

    return;
  }


  const wasNearBottom =
    messagesBox.scrollHeight -
    messagesBox.scrollTop -
    messagesBox.clientHeight
    < 120;


  messagesBox.innerHTML =
    list.map(
      message => {

        const mine =
          message.uid ===
          currentUser?.uid;


        const time =
          message.createdAt
            ? formatTime(
                message.createdAt
              )
            : "now";


        const replyHTML =
          message.replyTo
            ? `
              <div class="reply-box">

                <strong>
                  ${escapeHTML(
                    message.replyTo.name ||
                    "Guest"
                  )}
                  ${escapeHTML(
                    message.replyTo.username ||
                    ""
                  )}
                </strong>

                <span>
                  ${escapeHTML(
                    message.replyTo.text ||
                    ""
                  )}
                </span>

              </div>
            `
            : "";


        return `

          <div
            class="message-wrap"
            data-id="${escapeHTML(message.id)}">

            <div
              class="reply-action left">
              ↪
            </div>

            <div
              class="reply-action right">
              ↩
            </div>

            <div
              class="message
              ${mine ? "me" : "other"}">

              <div class="user">

                ${escapeHTML(
                  message.name ||
                  "Guest"
                )}

                ${escapeHTML(
                  message.username ||
                  ""
                )}

              </div>

              ${replyHTML}

              <div
                class="bubble">

                ${escapeHTML(
                  message.text ||
                  ""
                )}

                ${
                  message.edited
                    ? `<span class="edited">edited</span>`
                    : ""
                }

              </div>

              <div class="time">
                ${escapeHTML(time)}
              </div>

            </div>

          </div>
        `;

      }
    ).join("");


  attachMessageEvents();


  if(wasNearBottom){

    messagesBox.scrollTop =
      messagesBox.scrollHeight;

  }
}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(timestamp){

  try{

    return new Date(
      timestamp
    ).toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch{

    return "now";

  }
}


/* =====================================================
   MESSAGE EVENTS
===================================================== */

function attachMessageEvents(){

  const wrappers =
    messagesBox.querySelectorAll(
      ".message-wrap"
    );


  wrappers.forEach(
    wrapper => {

      const id =
        wrapper.dataset.id;

      const message =
        messages.find(
          item =>
            item.id === id
        );

      if(!message)
        return;


      setupSwipe(
        wrapper,
        message
      );


      if(
        message.uid ===
        currentUser?.uid
      ){

        setupLongPress(
          wrapper,
          message
        );

      }

    }
  );
}


/* =====================================================
   SWIPE
   ANY MESSAGE
===================================================== */

function setupSwipe(
  wrapper,
  message
){

  let startX =
    0;

  let startY =
    0;

  let currentX =
    0;

  let dragging =
    false;


  wrapper.addEventListener(
    "touchstart",
    event => {

      if(
        event.touches.length !== 1
      )
        return;

      startX =
        event.touches[0].clientX;

      startY =
        event.touches[0].clientY;

      currentX =
        startX;

      dragging =
        true;

    },
    {
      passive:true
    }
  );


  wrapper.addEventListener(
    "touchmove",
    event => {

      if(!dragging)
        return;

      const x =
        event.touches[0].clientX;

      const y =
        event.touches[0].clientY;

      const dx =
        x - startX;

      const dy =
        y - startY;


      if(
        Math.abs(dy) >
        Math.abs(dx)
      ){

        return;

      }


      if(
        Math.abs(dx) > 8
      ){

        currentX =
          x;

        const limited =
          Math.max(
            -85,
            Math.min(
              85,
              dx
            )
          );


        const msg =
          wrapper.querySelector(
            ".message"
          );

        msg.style.transform =
          `translateX(${limited}px)`;


        wrapper.classList.toggle(
          "replying",
          Math.abs(dx) > 35
        );

      }

    },
    {
      passive:true
    }
  );


  wrapper.addEventListener(
    "touchend",
    () => {

      if(!dragging)
        return;

      dragging =
        false;


      const dx =
        currentX - startX;


      const msg =
        wrapper.querySelector(
          ".message"
        );

      msg.style.transform =
        "";


      wrapper.classList.remove(
        "replying"
      );


      if(
        Math.abs(dx) >= 55
      ){

        selectReply(
          message
        );

      }

    },
    {
      passive:true
    }
  );

}


/* =====================================================
   LONG PRESS
   OWN MESSAGE ONLY
===================================================== */

function setupLongPress(
  wrapper,
  message
){

  let timer =
    null;

  let startX =
    0;

  let startY =
    0;


  function start(event){

    const point =
      event.touches
        ? event.touches[0]
        : event;


    startX =
      point.clientX;

    startY =
      point.clientY;


    timer =
      setTimeout(
        () => {

          showContextMenu(
            message,
            wrapper
          );

        },
        600
      );

  }


  function cancel(event){

    if(timer){

      clearTimeout(
        timer
      );

      timer =
        null;

    }

  }


  wrapper.addEventListener(
    "touchstart",
    start,
    {
      passive:true
    }
  );


  wrapper.addEventListener(
    "touchmove",
    event => {

      const point =
        event.touches[0];

      if(
        Math.abs(
          point.clientX -
          startX
        ) > 12 ||
        Math.abs(
          point.clientY -
          startY
        ) > 12
      ){

        cancel();

      }

    },
    {
      passive:true
    }
  );


  wrapper.addEventListener(
    "touchend",
    cancel,
    {
      passive:true
    }
  );


  wrapper.addEventListener(
    "touchcancel",
    cancel,
    {
      passive:true
    }
  );


  wrapper.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();

      showContextMenu(
        message,
        wrapper
      );

    }
  );

}


/* =====================================================
   REPLY
===================================================== */

function selectReply(message){

  replyTo = {

    id:
      message.id,

    uid:
      message.uid,

    name:
      message.name ||
      "Guest",

    username:
      message.username ||
      "",

    text:
      message.text ||
      ""

  };


  replyPreviewName.textContent =
    (
      message.name ||
      "Guest"
    ) +
    " " +
    (
      message.username ||
      ""
    );


  replyPreviewText.textContent =
    message.text ||
    "";


  replyPreview.classList.remove(
    "hidden"
  );


  messageInput.focus();


  showToast(
    "Replying to " +
    (
      message.name ||
      "Guest"
    )
  );
}


function clearReply(){

  replyTo =
    null;

  replyPreview.classList.add(
    "hidden"
  );

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  if(sending)
    return;


  const text =
    messageInput.value.trim();


  if(!text)
    return;


  if(
    !currentUser ||
    !profile
  ){

    setStatus(
      "Join the community first."
    );

    return;

  }


  sending =
    true;

  sendBtn.disabled =
    true;

  sendBtn.textContent =
    "…";


  try{

    const messagesRef =
      ref(
        db,
        "community/messages"
      );


    const newMessage =
      {

        uid:
          currentUser.uid,

        name:
          profile.name,

        username:
          profile.username,

        text:
          text.slice(
            0,
            500
          ),

        createdAt:
          serverTimestamp(),

        edited:
          false

      };


    if(replyTo){

      newMessage.replyTo =
        {

          id:
            replyTo.id,

          uid:
            replyTo.uid,

          name:
            replyTo.name,

          username:
            replyTo.username,

          text:
            replyTo.text

        };

    }


    await push(
      messagesRef,
      newMessage
    );


    messageInput.value =
      "";

    clearReply();


    setStatus(
      "Message sent • Live chat"
    );


    messageInput.focus();


  }catch(error){

    console.error(
      "Send error:",
      error
    );

    setStatus(
      "Message failed: " +
      error.message
    );


  }finally{

    sending =
      false;

    sendBtn.disabled =
      false;

    sendBtn.textContent =
      "➤";

  }

}


/* =====================================================
   CONTEXT MENU
===================================================== */

function showContextMenu(
  message,
  wrapper
){

  if(
    message.uid !==
    currentUser?.uid
  ){

    return;

  }


  selectedMessage =
    message;


  const rect =
    wrapper.getBoundingClientRect();


  let left =
    rect.left + 10;

  let top =
    rect.bottom + 5;


  if(
    left + 160 >
    window.innerWidth
  ){

    left =
      window.innerWidth -
      170;

  }


  if(
    top + 100 >
    window.innerHeight
  ){

    top =
      rect.top -
      105;

  }


  contextMenu.style.left =
    Math.max(
      8,
      left
    ) + "px";


  contextMenu.style.top =
    Math.max(
      8,
      top
    ) + "px";


  contextMenu.classList.remove(
    "hidden"
  );

}


/* =====================================================
   CLOSE CONTEXT MENU
===================================================== */

function closeContextMenu(){

  contextMenu.classList.add(
    "hidden"
  );

}


/* =====================================================
   EDIT
===================================================== */

function openEdit(){

  if(!selectedMessage)
    return;


  if(
    selectedMessage.uid !==
    currentUser?.uid
  )
    return;


  closeContextMenu();


  editTextarea.value =
    selectedMessage.text ||
    "";


  editModal.classList.remove(
    "hidden"
  );


  setTimeout(
    () => {

      editTextarea.focus();

      editTextarea.setSelectionRange(
        editTextarea.value.length,
        editTextarea.value.length
      );

    },
    100
  );

}


async function saveEdit(){

  if(!selectedMessage)
    return;


  const text =
    editTextarea.value.trim();


  if(!text){

    showToast(
      "Message cannot be empty"
    );

    return;

  }


  if(
    selectedMessage.uid !==
    currentUser?.uid
  ){

    closeEdit();

    return;

  }


  editDone.disabled =
    true;

  editDone.textContent =
    "Saving…";


  try{

    const messageRef =
      ref(
        db,
        "community/messages/" +
        selectedMessage.id
      );


    await update(
      messageRef,
      {

        text:
          text.slice(
            0,
            500
          ),

        edited:
          true,

        editedAt:
          serverTimestamp()

      }
    );


    closeEdit();

    showToast(
      "Message edited"
    );


  }catch(error){

    console.error(
      error
    );

    showToast(
      "Edit failed"
    );

  }finally{

    editDone.disabled =
      false;

    editDone.textContent =
      "Done";

  }

}


function closeEdit(){

  editModal.classList.add(
    "hidden"
  );

}


/* =====================================================
   DELETE
===================================================== */

function openDelete(){

  if(!selectedMessage)
    return;


  if(
    selectedMessage.uid !==
    currentUser?.uid
  )
    return;


  closeContextMenu();


  deleteModal.classList.remove(
    "hidden"
  );

}


async function confirmDelete(){

  if(!selectedMessage)
    return;


  if(
    selectedMessage.uid !==
    currentUser?.uid
  ){

    closeDelete();

    return;

  }


  deleteConfirm.disabled =
    true;

  deleteConfirm.textContent =
    "Deleting…";


  try{

    const messageRef =
      ref(
        db,
        "community/messages/" +
        selectedMessage.id
      );


    await remove(
      messageRef
    );


    closeDelete();

    showToast(
      "Message deleted"
    );


  }catch(error){

    console.error(
      error
    );

    showToast(
      "Delete failed"
    );

  }finally{

    deleteConfirm.disabled =
      false;

    deleteConfirm.textContent =
      "Delete";

  }

}


function closeDelete(){

  deleteModal.classList.add(
    "hidden"
  );

}


/* =====================================================
   LEAVE
===================================================== */

async function leaveCommunity(){

  try{

    if(currentUser){

      const presenceRef =
        ref(
          db,
          "community/presence/" +
          currentUser.uid
        );


      await set(
        presenceRef,
        {

          uid:
            currentUser.uid,

          name:
            profile?.name ||
            "Guest",

          username:
            profile?.username ||
            "",

          online:
            false,

          lastSeen:
            serverTimestamp()

        }
      );

    }

  }catch(error){

    console.warn(error);

  }


  if(messagesUnsubscribe){

    messagesUnsubscribe();

    messagesUnsubscribe =
      null;

  }


  if(presenceUnsubscribe){

    presenceUnsubscribe();

    presenceUnsubscribe =
      null;

  }


  clearProfile();

  profile =
    null;

  messages =
    [];

  clearReply();

  joinBox.classList.remove(
    "hidden"
  );

  chatBox.classList.add(
    "hidden"
  );

  messageInput.value =
    "";

  setStatus(
    "Disconnected"
  );

}


/* =====================================================
   BACK BUTTON
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    if(
      !chatBox.classList.contains(
        "hidden"
      )
    ){

      leaveCommunity();

      return;

    }


    if(
      window.history.length > 1
    ){

      window.history.back();

    }

  }
);


/* =====================================================
   EVENTS
===================================================== */

joinBtn.addEventListener(
  "click",
  joinCommunity
);


sendBtn.addEventListener(
  "click",
  sendMessage
);


cancelReply.addEventListener(
  "click",
  clearReply
);


leaveBtn.addEventListener(
  "click",
  leaveCommunity
);


editMenuBtn.addEventListener(
  "click",
  openEdit
);


deleteMenuBtn.addEventListener(
  "click",
  openDelete
);


editCancel.addEventListener(
  "click",
  closeEdit
);


editDone.addEventListener(
  "click",
  saveEdit
);


deleteCancel.addEventListener(
  "click",
  closeDelete
);


deleteConfirm.addEventListener(
  "click",
  confirmDelete
);


/* =========================
   ENTER SEND
========================= */

messageInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   CLOSE MENUS
========================= */

document.addEventListener(
  "touchstart",
  event => {

    if(
      !contextMenu.contains(
        event.target
      )
    ){

      closeContextMenu();

    }

  },
  {
    passive:true
  }
);


/* =========================
   MODAL OUTSIDE CLICK
========================= */

editModal.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      editModal
    ){

      closeEdit();

    }

  }
);


deleteModal.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      deleteModal
    ){

      closeDelete();

    }

  }
);


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  user => {

    currentUser =
      user;

  }
);


/* =====================================================
   AUTO JOIN
===================================================== */

async function autoJoin(){

  const stored =
    getStoredProfile();


  if(
    !stored?.name ||
    !stored?.username
  ){

    return;

  }


  nameInput.value =
    stored.name;

  usernameInput.value =
    stored.username;


  try{

    const user =
      await authenticate();


    profile = {

      name:
        stored.name,

      username:
        stored.username,

      uid:
        user.uid

    };


    saveProfile(
      profile
    );


    joinBox.classList.add(
      "hidden"
    );

    chatBox.classList.remove(
      "hidden"
    );


    await startPresence();

    startMessages();


  }catch(error){

    console.warn(
      "Auto join failed:",
      error
    );

    clearProfile();

  }

}


/* =====================================================
   PAGE HIDE
===================================================== */

window.addEventListener(
  "pagehide",
  () => {

    if(
      currentUser
    ){

      const presenceRef =
        ref(
          db,
          "community/presence/" +
          currentUser.uid
        );


      set(
        presenceRef,
        {

          uid:
            currentUser.uid,

          name:
            profile?.name ||
            "Guest",

          username:
            profile?.username ||
            "",

          online:
            false,

          lastSeen:
            serverTimestamp()

        }
      ).catch(
        () => {}
      );

    }

  }
);


/* =====================================================
   START
===================================================== */

autoJoin();
