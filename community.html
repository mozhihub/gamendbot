<!DOCTYPE html>
<html lang="en" data-theme="0">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>GAMEND X — Community</title>

<meta name="theme-color" content="#d50000">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<script>
(function(){

  try{

    const theme=Math.min(
      5,
      Math.max(
        0,
        Number(
          localStorage.getItem("gx_theme") || 0
        )
      )
    );

    const mode =
      localStorage.getItem("gx_mode");

    const motion =
      JSON.parse(
        localStorage.getItem("gx_motion") ?? "true"
      );

    document.documentElement.dataset.theme =
      theme;

    if(mode==="light"){
      document.documentElement.classList.add("light");
    }

    if(!motion){
      document.documentElement.classList.add(
        "reduced-motion"
      );
    }

  }catch(e){}

})();
</script>


<style>

/* =====================================================
   THEME
===================================================== */

:root{

  --primary:#d50000;
  --primary2:#ff1744;

  --accent:#00d9ff;

  --bg:#0b0e14;
  --card:#151a22;

  --text:#f7f9fc;
  --muted:#a8b2c0;

  --border:#242b36;

  --glass:rgba(18,22,30,.84);

  --shadow:
    0 16px 44px rgba(0,0,0,.32);

  --header-h:68px;
  --composer-h:76px;

}


html[data-theme="1"]{

  --primary:#0066ff;
  --primary2:#00c6ff;

}


html[data-theme="2"]{

  --primary:#00a86b;
  --primary2:#00d99b;

}


html[data-theme="3"]{

  --primary:#e30613;
  --primary2:#ff4b57;

}


html[data-theme="4"]{

  --primary:#d08a00;
  --primary2:#ffc62e;

}


html[data-theme="5"]{

  --primary:#7b2cff;
  --primary2:#c14dff;

}


html.light{

  --bg:#f4f6fb;
  --card:#fff;

  --text:#172033;
  --muted:#687185;

  --border:#e7eaf0;

  --glass:rgba(255,255,255,.84);

  --shadow:
    0 14px 40px rgba(15,23,42,.08);

}


/* =====================================================
   RESET
===================================================== */

*{

  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent;

}


html,
body{

  width:100%;
  height:100%;

  margin:0;

  overflow:hidden;

}


body{

  font-family:
    Poppins,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -20%,
      color-mix(
        in srgb,
        var(--primary) 18%,
        transparent
      ),
      transparent 45%
    ),
    var(--bg);

  color:var(--text);

  overscroll-behavior:none;

  touch-action:manipulation;

}


button,
input,
textarea{

  font:inherit;

}


button{

  -webkit-user-select:none;
  user-select:none;

}


[hidden]{

  display:none!important;

}


html.reduced-motion *,
body.reduced-motion *{

  animation-duration:.01ms!important;

  animation-iteration-count:1!important;

  transition-duration:.01ms!important;

  scroll-behavior:auto!important;

}


/* =====================================================
   APP
===================================================== */

.app{

  width:100%;
  height:100%;

  position:relative;

}


/* =====================================================
   HEADER
===================================================== */

.header{

  position:fixed;

  z-index:50;

  top:0;
  left:0;
  right:0;

  height:var(--header-h);

  padding:
    max(8px,env(safe-area-inset-top))
    10px
    8px;

  display:flex;

  align-items:center;

  gap:7px;

  background:var(--glass);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-bottom:
    1px solid var(--border);

}


.back-btn,
.logout-btn{

  width:42px;
  height:42px;

  flex:0 0 42px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid var(--border);

  border-radius:13px;

  background:var(--card);

  color:var(--text);

  cursor:pointer;

  transition:
    transform .15s ease,
    background .2s ease,
    border-color .2s ease;

}


.back-btn:active,
.logout-btn:active{

  transform:scale(.92);

}


.header-title{

  min-width:0;

  flex:1;

}


.header-title h1{

  margin:0;

  font-size:17px;

  line-height:22px;

  font-weight:700;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


.header-title p{

  margin:1px 0 0;

  color:var(--muted);

  font-size:10px;

  line-height:15px;

}


/* =====================================================
   ONLINE PILL
===================================================== */

.online-pill{

  display:flex;

  align-items:center;

  gap:5px;

  height:31px;

  padding:0 8px;

  border:
    1px solid var(--border);

  border-radius:999px;

  background:var(--card);

  color:var(--muted);

  font-size:10px;

  font-weight:600;

  white-space:nowrap;

}


.online-dot{

  width:7px;
  height:7px;

  flex:0 0 7px;

  border-radius:50%;

  background:#20d46b;

  box-shadow:
    0 0 10px rgba(32,212,107,.55);

}


/* =====================================================
   VISITS PILL
===================================================== */

.visits-pill{

  display:flex;

  align-items:center;

  gap:5px;

  height:31px;

  padding:0 8px;

  border:
    1px solid var(--border);

  border-radius:999px;

  background:var(--card);

  color:var(--muted);

  font-size:10px;

  font-weight:600;

  white-space:nowrap;

}


.visits-pill i{

  color:var(--primary);

  font-size:10px;

}


/* =====================================================
   JOIN SCREEN
===================================================== */

.guest-screen{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:
    calc(var(--header-h) + 20px)
    20px
    30px;

}


.join-card{

  width:min(440px,100%);

  padding:
    25px
    20px
    21px;

  border:
    1px solid var(--border);

  border-radius:24px;

  background:var(--glass);

  backdrop-filter:blur(20px);

  -webkit-backdrop-filter:blur(20px);

  box-shadow:var(--shadow);

}


.join-logo{

  width:64px;
  height:64px;

  margin:
    0 auto
    15px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:#fff;

  font-size:27px;

}


.join-card h2{

  margin:0;

  text-align:center;

  font-size:22px;

}


.subtitle{

  margin:
    7px
    0
    22px;

  text-align:center;

  color:var(--muted);

  font-size:12px;

  line-height:19px;

}


.input-wrap{

  margin-bottom:12px;

}


.input-label{

  display:block;

  margin:
    0
    0
    6px
    3px;

  color:var(--muted);

  font-size:11px;

  font-weight:600;

}


.input-box{

  position:relative;

}


.input-box i{

  position:absolute;

  z-index:2;

  left:13px;

  top:50%;

  transform:translateY(-50%);

  color:var(--muted);

  font-size:14px;

}


.input-box input{

  width:100%;

  height:48px;

  padding:
    0
    13px
    0
    39px;

  border:
    1px solid var(--border);

  border-radius:14px;

  outline:none;

  background:var(--card);

  color:var(--text);

  font-size:13px;

}


.input-box input::placeholder{

  color:var(--muted);

}


.input-box input:focus{

  border-color:var(--primary);

  box-shadow:
    0 0 0 3px
    color-mix(
      in srgb,
      var(--primary) 13%,
      transparent
    );

}


.join-btn{

  width:100%;

  height:49px;

  margin-top:8px;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:#fff;

  font-size:13px;

  font-weight:700;

  cursor:pointer;

}


.join-btn:active{

  transform:scale(.98);

}


.join-btn:disabled{

  opacity:.55;

}


/* =====================================================
   CHAT
===================================================== */

.chat-shell{

  position:absolute;

  inset:0;

}


.messages{

  position:absolute;

  top:var(--header-h);

  left:0;
  right:0;

  bottom:var(--composer-h);

  overflow-y:auto;

  overflow-x:hidden;

  padding:
    12px
    11px
    18px;

  overscroll-behavior:contain;

  scroll-behavior:smooth;

}


.empty-chat{

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:var(--muted);

  font-size:12px;

}


.message-row{

  width:100%;

  display:flex;

  margin:3px 0;

  touch-action:pan-y;

  will-change:transform;

}


.message-row.mine{

  justify-content:flex-end;

}


.message-bubble{

  position:relative;

  max-width:min(82%,430px);

  padding:
    8px
    11px
    7px;

  border:
    1px solid var(--border);

  border-radius:16px;

  background:var(--card);

  box-shadow:
    0 4px 14px rgba(0,0,0,.08);

  user-select:text;

  transition:
    transform .15s ease;

}


.message-row.mine
.message-bubble{

  border-color:
    color-mix(
      in srgb,
      var(--primary) 35%,
      var(--border)
    );

  background:
    color-mix(
      in srgb,
      var(--primary) 10%,
      var(--card)
    );

  border-bottom-right-radius:5px;

}


.message-row:not(.mine)
.message-bubble{

  border-bottom-left-radius:5px;

}


.message-author{

  margin-bottom:3px;

  color:var(--primary);

  font-size:10px;

  font-weight:700;

}


.message-author span{

  color:var(--muted);

  font-weight:500;

}


.message-text{

  color:var(--text);

  font-size:13px;

  line-height:19px;

  white-space:pre-wrap;

  overflow-wrap:anywhere;

}


.message-meta{

  display:flex;

  align-items:center;

  justify-content:flex-end;

  gap:5px;

  margin-top:4px;

  color:var(--muted);

  font-size:8px;

}


.edited-label{

  font-size:8px;

}


/* =====================================================
   REPLY PREVIEW
===================================================== */

.reply-preview{

  margin-bottom:6px;

  padding:6px 8px;

  border-left:
    3px solid var(--primary);

  border-radius:7px;

  background:
    color-mix(
      in srgb,
      var(--primary) 8%,
      transparent
    );

}


.reply-preview-name{

  color:var(--primary);

  font-size:9px;

  font-weight:700;

}


.reply-preview-text{

  margin-top:1px;

  color:var(--muted);

  font-size:9px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


/* =====================================================
   COMPOSER
===================================================== */

.composer{

  position:fixed;

  z-index:45;

  left:0;
  right:0;
  bottom:0;

  min-height:var(--composer-h);

  padding:
    8px
    10px
    max(9px,env(safe-area-inset-bottom));

  background:var(--glass);

  backdrop-filter:blur(18px);

  -webkit-backdrop-filter:blur(18px);

  border-top:
    1px solid var(--border);

}


.reply-bar{

  display:flex;

  align-items:center;

  gap:8px;

  margin-bottom:7px;

  padding:7px 9px;

  border:
    1px solid var(--border);

  border-radius:10px;

  background:var(--card);

}


.reply-content{

  min-width:0;

  flex:1;

}


.reply-label{

  color:var(--primary);

  font-size:9px;

  font-weight:700;

}


.reply-name{

  font-size:9px;

  font-weight:600;

}


.reply-text{

  color:var(--muted);

  font-size:9px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


.cancel-reply{

  width:28px;
  height:28px;

  flex:0 0 28px;

  border:0;

  border-radius:8px;

  background:transparent;

  color:var(--muted);

}


.composer-row{

  display:flex;

  align-items:center;

  gap:7px;

}


.message-input{

  min-width:0;

  flex:1;

  height:47px;

  resize:none;

  padding:
    12px
    13px;

  border:
    1px solid var(--border);

  border-radius:15px;

  outline:none;

  background:var(--card);

  color:var(--text);

  font-size:13px;

  line-height:19px;

}


.message-input::placeholder{

  color:var(--muted);

}


.message-input:focus{

  border-color:var(--primary);

}


.send-btn{

  width:47px;
  height:47px;

  flex:0 0 47px;

  border:0;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:#fff;

  cursor:pointer;

}


.send-btn:active{

  transform:scale(.92);

}


.send-btn:disabled{

  opacity:.35;

}


/* =====================================================
   CONTEXT MENU
===================================================== */

.context-menu{

  position:fixed;

  z-index:100;

  min-width:170px;

  padding:6px;

  border:
    1px solid var(--border);

  border-radius:14px;

  background:var(--glass);

  backdrop-filter:blur(20px);

  -webkit-backdrop-filter:blur(20px);

  box-shadow:var(--shadow);

}


.context-menu button{

  width:100%;

  height:40px;

  display:flex;

  align-items:center;

  gap:10px;

  padding:
    0
    11px;

  border:0;

  border-radius:9px;

  background:transparent;

  color:var(--text);

  text-align:left;

  font-size:12px;

}


.context-menu .danger{

  color:#ff4d5f;

}


/* =====================================================
   MODALS
===================================================== */

.modal-backdrop{

  position:fixed;

  z-index:150;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.55);

  backdrop-filter:blur(7px);

  -webkit-backdrop-filter:blur(7px);

}


.modal{

  width:min(430px,100%);

  padding:19px;

  border:
    1px solid var(--border);

  border-radius:20px;

  background:var(--card);

  box-shadow:var(--shadow);

  animation:modalIn .18s ease;

}


@keyframes modalIn{

  from{

    opacity:0;

    transform:
      translateY(10px)
      scale(.97);

  }

  to{

    opacity:1;

    transform:none;

  }

}


.modal h3{

  margin:
    0
    0
    7px;

  font-size:17px;

}


.modal p{

  margin:
    0
    0
    15px;

  color:var(--muted);

  font-size:11px;

  line-height:18px;

}


.edit-area{

  width:100%;

  min-height:130px;

  resize:vertical;

  padding:11px;

  border:
    1px solid var(--border);

  border-radius:13px;

  outline:none;

  background:var(--bg);

  color:var(--text);

  font-size:13px;

  line-height:19px;

}


.edit-area:focus{

  border-color:var(--primary);

}


.modal-actions{

  display:flex;

  gap:8px;

  margin-top:13px;

}


.modal-btn{

  flex:1;

  height:43px;

  border:
    1px solid var(--border);

  border-radius:12px;

  background:var(--bg);

  color:var(--text);

  font-size:12px;

  font-weight:600;

}


.modal-btn.primary{

  border:0;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:#fff;

}


.modal-btn.danger{

  border:0;

  background:#e53935;

  color:#fff;

}


/* =====================================================
   TOAST
===================================================== */

.toast{

  position:fixed;

  z-index:300;

  left:50%;

  bottom:
    calc(
      var(--composer-h) +
      max(18px,env(safe-area-inset-bottom))
    );

  transform:
    translate(-50%,12px);

  max-width:
    calc(100% - 30px);

  padding:
    9px
    13px;

  border:
    1px solid var(--border);

  border-radius:11px;

  background:var(--card);

  color:var(--text);

  box-shadow:var(--shadow);

  font-size:11px;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .2s,
    transform .2s;

}


.toast.show{

  opacity:1;

  transform:
    translate(-50%,0);

}


/* =====================================================
   LOADING
===================================================== */

.loading{

  position:fixed;

  z-index:500;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  background:var(--bg);

}


.loader{

  width:35px;
  height:35px;

  border:
    3px solid var(--border);

  border-top-color:var(--primary);

  border-radius:50%;

  animation:
    spin .7s linear infinite;

}


@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:430px){

  .header{

    gap:5px;

    padding-left:7px;
    padding-right:7px;

  }


  .header-title{

    min-width:70px;

  }


  .header-title h1{

    font-size:15px;

  }


  .header-title p{

    font-size:9px;

  }


  .online-pill,
  .visits-pill{

    padding:0 7px;

    font-size:9px;

  }


  .logout-btn,
  .back-btn{

    width:39px;
    height:39px;

    flex-basis:39px;

  }

}


@media(max-width:370px){

  .header{

    gap:3px;

  }


  .online-pill,
  .visits-pill{

    height:29px;

    padding:0 6px;

    font-size:8px;

  }


  .online-pill .online-dot{

    width:6px;
    height:6px;

  }


  .logout-btn,
  .back-btn{

    width:37px;
    height:37px;

    flex-basis:37px;

  }


  .header-title h1{

    font-size:14px;

  }


  .header-title p{

    display:none;

  }


  .message-bubble{

    max-width:86%;

  }


  .join-card{

    padding:
      21px
      16px;

  }

}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <button
    class="back-btn"
    id="backBtn"
    aria-label="Back">

    <i class="fa-solid fa-arrow-left"></i>

  </button>


  <div class="header-title">

    <h1>Community</h1>

    <p>
      GAMEND X Community Chat
    </p>

  </div>


  <!-- ONLINE -->

  <div class="online-pill">

    <span class="online-dot"></span>

    <span id="onlineCount">
      0 Online
    </span>

  </div>


  <!-- VISITS -->

  <div
    class="visits-pill"
    title="Total Visits">

    <i class="fa-solid fa-chart-line"></i>

    <span id="visitCount">
      —
    </span>

  </div>


  <!-- LOGOUT -->

  <button
    class="logout-btn"
    id="logoutBtn"
    aria-label="Logout"
    title="Logout">

    <i class="fa-solid fa-right-from-bracket"></i>

  </button>

</header>


<!-- =====================================================
     JOIN
===================================================== -->

<section
  class="guest-screen"
  id="guestScreen">

  <div class="join-card">


    <div class="join-logo">

      <i class="fa-solid fa-comments"></i>

    </div>


    <h2>
      Join Community
    </h2>


    <p class="subtitle">

      Enter your name and username
      to start chatting.

    </p>


    <div class="input-wrap">

      <label class="input-label">
        Name
      </label>

      <div class="input-box">

        <i class="fa-solid fa-user"></i>

        <input
          id="guestName"
          type="text"
          maxlength="40"
          autocomplete="name"
          placeholder="Enter your name">

      </div>

    </div>


    <div class="input-wrap">

      <label class="input-label">
        Username
      </label>

      <div class="input-box">

        <i class="fa-solid fa-at"></i>

        <input
          id="guestUsername"
          type="text"
          maxlength="20"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          placeholder="username">

      </div>

    </div>


    <button
      class="join-btn"
      id="joinBtn">

      <i class="fa-solid fa-arrow-right-to-bracket"></i>

      &nbsp;

      Join Community

    </button>


  </div>

</section>


<!-- =====================================================
     CHAT
===================================================== -->

<section
  class="chat-shell"
  id="chatShell"
  hidden>


  <main
    class="messages"
    id="messages">
  </main>


  <div class="composer">


    <!-- REPLY BAR -->

    <div
      class="reply-bar"
      id="replyBar"
      hidden>

      <div class="reply-content">

        <div class="reply-label">
          Replying to
        </div>

        <div
          class="reply-name"

function cleanUsername(value){

  value=
    String(value || "")
    .trim()
    .replace(/\s+/g,"")
    .toLowerCase();


  if(
    value.startsWith("@")
  ){

    value=value.slice(1);

  }


  return value;

}


function validProfile(
  name,
  username
){

    name.length>40

    return false;

  }


  if(
    !/^[a-zA-Z0-9_]{3,20}$/
      .test(username)
  ){

    return false;

  }


  return true;

}

/* =====================================================
   VISIT COUNTER
   Persistent Firebase Total
===================================================== */

async function countVisit(){

  try{

    /*
      Always make sure Firebase
      anonymous authentication exists.
    */

    if(!auth.currentUser){

      await f.signInAnonymously(
        auth
      );

    }


    const user=
      auth.currentUser;


    if(!user){

      return;

    }


    const visitRef=
      f.ref(
        db,
        "community/stats/visits"
      );


    /*
      Count only once per browser
      session.

      Refresh:
      NO additional count.

      New tab/session:
      counts as a new visit.
    */

    if(
      sessionStorage.getItem(
        "gx_community_visit_counted"
      ) !== "1"
    ){

      const result=
        await f.runTransaction(

          visitRef,

          currentValue=>{

            const current=
              Number(currentValue) || 0;

            return current+1;

          }

        );


      if(result.committed){

        sessionStorage.setItem(
          "gx_community_visit_counted",
          "1"
        );

      }

    }


    /*
      Listen to the Firebase total
      so every client gets the
      latest number.
    */

    if(visitUnsubscribe){

      visitUnsubscribe();

      visitUnsubscribe=null;

    }


    visitUnsubscribe=
      f.onValue(

        visitRef,

        snapshot=>{

          const total=
            Number(
              snapshot.val()
            ) || 0;


          visitCount.textContent=
            total.toLocaleString(
              "en-IN"
            );

        },

        error=>{

          console.error(
            "Visit listener error:",
            error
          );

          /*
            Keep existing value if
            Firebase listener fails.
          */

          if(
            visitCount.textContent===
            "—"
          ){

            visitCount.textContent=
              "0";

          }

        }

      );


  }catch(error){

    console.error(
      "Visit counter error:",
      error
    );


    /*
      Don't break Community if
      visitor counter fails.
    */

    if(
      visitCount.textContent===
      "—"
    ){

      visitCount.textContent=
        "0";

    }

  }

}

/* =====================================================
   PRESENCE
===================================================== */

async function setupPresence(){

  if(!currentUser){

    return;

  }


  presenceRef=
    f.ref(
      db,
      "community/presence/"
      +currentUser.uid
    );


  await f.set(
    presenceRef,
    {

      online:true,

      name:
        guest?.name ||
        "Guest",

      username:
        guest?.username ||
        "",

      lastSeen:
        f.serverTimestamp()

    }
  );


  const disconnect=
    f.onDisconnect(
      presenceRef
    );


  await disconnect.set(
    {

      online:false,

      lastSeen:
        f.serverTimestamp()

    }
  );

}


/* =====================================================
   PRESENCE LISTENER
===================================================== */

function listenPresence(){

  if(
    presenceUnsubscribe
  ){

    presenceUnsubscribe();

    presenceUnsubscribe=null;

  }


  const presenceRoot=
    f.ref(
      db,
      "community/presence"
    );


  presenceUnsubscribe=
    f.onValue(

      presenceRoot,

      snapshot=>{

        let count=0;


        snapshot.forEach(
          child=>{

            const data=
              child.val();


            if(
              data &&
              data.online===true
            ){

              count++;

            }

          }
        );


        onlineCount.textContent=
          count+" Online";

      },

      error=>{

        console.error(
          "Presence error:",
          error
        );

        onlineCount.textContent=
          "0 Online";

      }

    );

}


/* =====================================================
   MESSAGE LISTENER
===================================================== */

function listenMessages(){

  if(
    messagesUnsubscribe
  ){

    messagesUnsubscribe();

    messagesUnsubscribe=null;

  }


  const messagesRef=
    f.ref(
      db,
      "community/messages"
    );


  messagesUnsubscribe=
    f.onValue(

      messagesRef,

      snapshot=>{

        messageMap.clear();


        snapshot.forEach(
          child=>{

            const value=
              child.val();


            if(value){

              messageMap.set(

                child.key,

                {
                  id:child.key,
                  ...value
                }

              );

            }

          }
        );


        renderMessages();

      },

      error=>{

        console.error(
          "Messages error:",
          error
        );

        toast(
          "Unable to load messages"
        );

      }

    );

}


/* =====================================================
   TIME
===================================================== */

function formatTime(
  timestamp
){

  if(
    !timestamp ||
    typeof timestamp!=="number"
  ){

    return "";

  }


  try{

    return new Intl.DateTimeFormat(

      undefined,

      {
        hour:"numeric",
        minute:"2-digit"
      }

    ).format(
      new Date(timestamp)
    );

  }catch{

    return "";

  }

}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(){

  const wasNearBottom=
    messages.scrollHeight -
    messages.scrollTop -
    messages.clientHeight <
    130;


  messages.replaceChildren();


  if(
    messageMap.size===0
  ){

    const empty=
      document.createElement(
        "div"
      );


    empty.className=
      "empty-chat";


    empty.textContent=
      "No messages yet. Start the conversation!";


    messages.appendChild(
      empty
    );


    return;

  }


  const sorted=
    [...messageMap.values()]
    .sort(

      (a,b)=>
        Number(a.createdAt || 0) -
        Number(b.createdAt || 0)

    );


  for(
    const msg of sorted
  ){

    const row=
      document.createElement(
        "div"
      );


    row.className=
      "message-row";


    if(
      currentUser &&
      msg.uid===currentUser.uid
    ){

      row.classList.add(
        "mine"
      );

    }


    const bubble=
      document.createElement(
        "div"
      );


    bubble.className=
      "message-bubble";


    /* Reply */

    if(msg.replyTo){

      const preview=
        document.createElement(
          "div"
        );


      preview.className=
        "reply-preview";


      const pName=
        document.createElement(
          "div"
        );


      pName.className=
        "reply-preview-name";


      pName.textContent=
        msg.replyTo.name ||
        "User";


      const pText=
        document.createElement(
          "div"
        );


      pText.className=
        "reply-preview-text";


      pText.textContent=
        msg.replyTo.text ||
        "";


      preview.appendChild(
        pName
      );


      preview.appendChild(
        pText
      );


      bubble.appendChild(
        preview
      );

    }


    /* Author */

    const author=
      document.createElement(
        "div"
      );


    author.className=
      "message-author";


    const authorName=
      document.createElement(
        "span"
      );


    authorName.textContent=
      msg.name ||
      "Guest";


    author.appendChild(
      authorName
    );


    if(msg.username){

      const username=
        document.createElement(
          "span"
        );


      username.textContent=
        " "+msg.username;


      author.appendChild(
        username
      );

    }


    bubble.appendChild(
      author
    );


    /* Text */

    const text=
      document.createElement(
        "div"
      );


    text.className=
      "message-text";


    text.textContent=
      msg.text ||
      "";


    bubble.appendChild(
      text
    );


    /* Meta */

    const meta=
      document.createElement(
        "div"
      );


    meta.className=
      "message-meta";


    if(msg.edited){

      const edited=
        document.createElement(
          "span"
        );


      edited.className=
        "edited-label";


      edited.textContent=
        "edited";


      meta.appendChild(
        edited
      );

    }


    const time=
      document.createElement(
        "span"
      );


    time.textContent=
      formatTime(
        msg.createdAt
      );


    meta.appendChild(
      time
    );


    bubble.appendChild(
      meta
    );


    row.appendChild(
      bubble
    );


    attachSwipe(
      row,
      msg
    );


    messages.appendChild(
      row
    );

  }


  if(wasNearBottom){

    requestAnimationFrame(
      ()=>{

        messages.scrollTop=
          messages.scrollHeight;

      }
    );

  }

}


/* =====================================================
   SWIPE + LONG PRESS
===================================================== */

function attachSwipe(
  row,
  msg
){

  let startX=0;

  let startY=0;

  let dragging=false;

  let moved=false;

  let longPressTimer=null;

  let suppressContext=false;


  function clearLongPress(){

    if(longPressTimer){

      clearTimeout(
        longPressTimer
      );

      longPressTimer=null;

    }

  }


  row.addEventListener(

    "pointerdown",

    event=>{

      if(
        event.pointerType==="mouse"
      ){

        return;

      }


      startX=
        event.clientX;

      startY=
        event.clientY;

      dragging=true;

      moved=false;

      suppressContext=false;


      clearLongPress();


      /*
        Only own message can
        open Edit/Delete.
      */

      if(

        currentUser &&
        msg.uid===
        currentUser.uid

      ){

        longPressTimer=
          setTimeout(

            ()=>{

              if(
                dragging &&
                !moved
              ){

                suppressContext=true;


                selectedMessage=
                  msg;


                showContextMenu(

                  event.clientX,

                  event.clientY,

                  msg

                );

              }

            },

            600

          );

      }

    },

    {
      passive:true
    }

  );


  row.addEventListener(

    "pointermove",

    event=>{

      if(!dragging){

        return;

      }


      const dx=
        event.clientX-startX;


      const dy=
        event.clientY-startY;


      if(

        Math.abs(dx)>8 ||
        Math.abs(dy)>8

      ){

        moved=true;

      }


      if(

        Math.abs(dx)>
        Math.abs(dy) &&

        Math.abs(dx)<90

      ){

        clearLongPress();


        row.style.transform=
          `translateX(${dx*.35}px)`;

      }

    },

    {
      passive:true
    }

  );


  row.addEventListener(

    "pointerup",

    event=>{

      if(!dragging){

        return;

      }


      dragging=false;

      clearLongPress();


      const dx=
        event.clientX-startX;


      const dy=
        event.clientY-startY;


      row.style.transform="";


      if(suppressContext){

        suppressContext=false;

        return;

      }


      /*
        Both left and right
        swipe = reply.
      */

      if(

        Math.abs(dx)>=55 &&

        Math.abs(dx)>
        Math.abs(dy)*1.25

      ){

        setReply(msg);

        tap();

      }

    },

    {
      passive:true
    }

  );


  row.addEventListener(

    "pointercancel",

    ()=>{

      dragging=false;

      clearLongPress();

      row.style.transform="";

    }

  );

}


/* =====================================================
   REPLY
===================================================== */

function setReply(msg){

  replyTarget={

    id:msg.id,

    uid:msg.uid,

    name:
      msg.name ||
      "User",

    username:
      msg.username ||
      "",

    text:
      msg.text ||
      ""

  };


  replyName.textContent=

    replyTarget.name+

    (

      replyTarget.username
        ? " "+replyTarget.username
        : ""

    );


  replyText.textContent=
    replyTarget.text;


  replyBar.hidden=false;


  messageInput.focus();

}


function clearReply(){

  replyTarget=null;

  replyBar.hidden=true;

  replyName.textContent="";

  replyText.textContent="";

}


/* =====================================================
   SEND
===================================================== */

async function sendMessage(){

  if(!currentUser){

    toast(
      "Join Community first"
    );

    return;

  }


  const text=
    messageInput.value.trim();


  if(!text){

    return;

  }


  sendBtn.disabled=true;


  try{

    const messagesRef=
      f.ref(
        db,
        "community/messages"
      );


    const newMessage=
      f.push(
        messagesRef
      );


    const payload={

      uid:
        currentUser.uid,

      name:
        guest.name,

      username:
        guest.username,

      text:
        text,

      createdAt:
        f.serverTimestamp()

    };


    if(replyTarget){

      payload.replyTo={

        id:
          replyTarget.id,

        uid:
          replyTarget.uid,

        name:
          replyTarget.name,

        username:
          replyTarget.username,

        text:
          replyTarget.text

      };

    }


    await f.set(
      newMessage,
      payload
    );


    messageInput.value="";

    messageInput.style.height=
      "47px";

    clearReply();

    updateSendState();

    tap();


  }catch(error){

    console.error(
      "Send error:",
      error
    );

    toast(
      "Message failed to send"
    );

  }finally{

    updateSendState();

  }

}


/* =====================================================
   CONTEXT MENU
===================================================== */

function closeContextMenu(
  clearSelection=true
){

  contextMenu.hidden=true;


  /*
    Edit/Delete click போது
    selectedMessage clear ஆகக்கூடாது.
  */

  if(clearSelection){

    selectedMessage=null;

  }

}


/* =====================================================
   SHOW CONTEXT MENU
===================================================== */

function showContextMenu(
  x,
  y,
  msg
){

  if(

    !currentUser ||
    msg.uid!==currentUser.uid

  ){

    return;

  }


  selectedMessage=
    msg;


  contextMenu.hidden=false;


  const width=170;

  const height=100;


  let left=x;

  let top=y;


  if(
    left+width>
    window.innerWidth-10
  ){

    left=
      window.innerWidth-
      width-
      10;

  }


  if(
    top+height>
    window.innerHeight-10
  ){

    top=
      window.innerHeight-
      height-
      10;

  }


  left=
    Math.max(
      10,
      left
    );


  top=
    Math.max(
      10,
      top
    );


  contextMenu.style.left=
    left+"px";


  contextMenu.style.top=
    top+"px";

}


/* =====================================================
   OPEN EDIT
===================================================== */

function openEdit(){

  if(

    !selectedMessage ||
    !currentUser ||
    selectedMessage.uid !==
    currentUser.uid

  ){

    closeContextMenu();

    return;

  }


  const message=
    selectedMessage;


  editArea.value=
    message.text || "";


  closeContextMenu(false);


  editModal.hidden=false;


  setTimeout(
    ()=>{

      editArea.focus();


      editArea.setSelectionRange(

        editArea.value.length,

        editArea.value.length

      );

    },
    80
  );

}


/* =====================================================
   SAVE EDIT
===================================================== */

async function saveEdit(){

  const message=
    selectedMessage;


  if(!message){

    toast(
      "Message not selected"
    );

    editModal.hidden=true;

    return;

  }


  if(

    !currentUser ||
    message.uid !==
    currentUser.uid

  ){

    toast(
      "You can edit only your message"
    );

    editModal.hidden=true;

    selectedMessage=null;

    return;

  }


  const text=
    editArea.value.trim();


  if(!text){

    toast(
      "Message cannot be empty"
    );

    return;

  }


  doneEdit.disabled=true;


  try{

    const messageRef=
      f.ref(

        db,

        "community/messages/"
        +message.id

      );


    await f.update(

      messageRef,

      {

        text:text,

        edited:true,

        editedAt:
          f.serverTimestamp()

      }

    );


    editModal.hidden=true;

    selectedMessage=null;

    toast(
      "Message edited"
    );

    tap();


  }catch(error){

    console.error(
      "EDIT ERROR:",
      error
    );


    toast(
      "Edit failed: "+
      (
        error?.message ||
        "Firebase error"
      )
    );


  }finally{

    doneEdit.disabled=false;

  }

}


/* =====================================================
   OPEN DELETE
===================================================== */

function openDelete(){

  if(

    !selectedMessage ||
    !currentUser ||
    selectedMessage.uid !==
    currentUser.uid

  ){

    closeContextMenu();

    return;

  }


  closeContextMenu(false);

  deleteModal.hidden=false;

}


/* =====================================================
   CONFIRM DELETE
===================================================== */

async function confirmDeleteMessage(){

  const message=
    selectedMessage;


  if(!message){

    toast(
      "Message not selected"
    );

    deleteModal.hidden=true;

    return;

  }


  if(

    !currentUser ||
    message.uid !==
    currentUser.uid

  ){

    toast(
      "You can delete only your message"
    );

    deleteModal.hidden=true;

    selectedMessage=null;

    return;

  }


  confirmDelete.disabled=true;


  try{

    const messageRef=
      f.ref(

        db,

        "community/messages/"
        +message.id

      );


    await f.remove(
      messageRef
    );


    deleteModal.hidden=true;

    selectedMessage=null;


    toast(
      "Message deleted"
    );


    tap();


  }catch(error){

    console.error(
      "DELETE ERROR:",
      error
    );


    toast(
      "Delete failed: "+
      (
        error?.message ||
        "Firebase error"
      )
    );


  }finally{

    confirmDelete.disabled=false;

  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logoutCommunity(){

  if(!currentUser){

    showJoin();

    return;

  }


  const confirmed=
    window.confirm(
      "Logout from Community?"
    );


  if(!confirmed){

    return;

  }


  tap();


  try{

    if(presenceRef){

      try{

        await f.set(

          presenceRef,

          {

            online:false,

            lastSeen:
              f.serverTimestamp()

          }

        );

      }catch(error){

        console.warn(
          "Presence update failed",
          error
        );

      }

    }


    if(messagesUnsubscribe){

      messagesUnsubscribe();

      messagesUnsubscribe=null;

    }


    if(presenceUnsubscribe){

      presenceUnsubscribe();

      presenceUnsubscribe=null;

    }


    await f.signOut(
      auth
    );


  }catch(error){

    console.error(
      "Logout error:",
      error
    );


  }finally{

    currentUser=null;

    guest=null;

    presenceRef=null;


    try{

      localStorage.removeItem(
        "gx_guest"
      );

      localStorage.removeItem(
        "gamend_guest"
      );

    }catch{}


    guestName.value="";

    guestUsername.value="";

    messageInput.value="";

    messageInput.style.height=
      "47px";


    messageMap.clear();

    messages.replaceChildren();

    clearReply();

    closeContextMenu();

    editModal.hidden=true;

    deleteModal.hidden=true;

    selectedMessage=null;

    updateSendState();

    showJoin();

    toast(
      "Logged out"
    );

  }

}


/* =====================================================
   BACK
===================================================== */

function closeCommunity(){

  tap();

  window.location.href=
    "index.html";

}


/* =====================================================
   EVENTS
===================================================== */

joinBtn.addEventListener(
  "click",
  joinCommunity
);


backBtn.addEventListener(
  "click",
  closeCommunity
);


logoutBtn.addEventListener(
  "click",
  logoutCommunity
);


sendBtn.addEventListener(
  "click",
  sendMessage
);


cancelReply.addEventListener(
  "click",
  ()=>{

    clearReply();

    tap();

  }
);


/* EDIT */

editMessageBtn.addEventListener(
  "click",
  openEdit
);


/* DELETE */

deleteMessageBtn.addEventListener(
  "click",
  openDelete
);


/* CANCEL EDIT */

cancelEdit.addEventListener(
  "click",
  ()=>{

    editModal.hidden=true;

    selectedMessage=null;

  }
);


/* DONE EDIT */

doneEdit.addEventListener(
  "click",
  saveEdit
);


/* CANCEL DELETE */

cancelDelete.addEventListener(
  "click",
  ()=>{

    deleteModal.hidden=true;

    selectedMessage=null;

  }
);


/* CONFIRM DELETE */

confirmDelete.addEventListener(
  "click",
  confirmDeleteMessage
);


/* =====================================================
   INPUT
===================================================== */

messageInput.addEventListener(

  "input",

  ()=>{

    updateSendState();


    messageInput.style.height=
      "47px";


    messageInput.style.height=
      Math.min(

        110,

        Math.max(

          47,

          messageInput.scrollHeight

        )

      )+"px";

  }

);


messageInput.addEventListener(

  "keydown",

  event=>{

    if(

      event.key==="Enter" &&
      !event.shiftKey

    ){

      event.preventDefault();

      sendMessage();

    }

  }

);


guestUsername.addEventListener(

  "input",

  ()=>{

    guestUsername.value=
      guestUsername.value
      .replace(/\s+/g,"")
      .toLowerCase();

  }

);


guestName.addEventListener(

  "keydown",

  event=>{

    if(
      event.key==="Enter"
    ){

      event.preventDefault();

      guestUsername.focus();

    }

  }

);


guestUsername.addEventListener(

  "keydown",

  event=>{

    if(
      event.key==="Enter"
    ){

      event.preventDefault();

      joinCommunity();

    }

  }

);


/* =====================================================
   CLOSE CONTEXT MENU
===================================================== */

document.addEventListener(

  "pointerdown",

  event=>{

    if(

      !contextMenu.hidden &&
      !contextMenu.contains(
        event.target
      )

    ){

      closeContextMenu();

    }

  }

);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(

  "keydown",

  event=>{

    if(
      event.key==="Escape"
    ){

      closeContextMenu();

      editModal.hidden=true;

      deleteModal.hidden=true;

      selectedMessage=null;

    }

  }

);


/* =====================================================
   AUTH
===================================================== */

f.onAuthStateChanged(

  auth,

  user=>{

    currentUser=user;

  }

);


/* =====================================================
   BOOT
===================================================== */

async function boot(){

  try{

    /*
      Visitor counter starts immediately.
      It does NOT depend on joining chat.
    */

    await countVisit();


    if(auth.currentUser){

      currentUser=
        auth.currentUser;

    }


    guest=
      getJSON(
        "gx_guest",
        null
      );


    /*
      Old profile compatibility.
    */

    if(!guest){

      const oldGuest=
        getJSON(
          "gamend_guest",
          null
        );


      if(oldGuest){

        guest=oldGuest;


        saveJSON(
          "gx_guest",
          guest
        );

      }

    }


    if(

      guest &&
      guest.name &&
      guest.username

    ){

      guestName.value=
        guest.name;


      guestUsername.value=
        cleanUsername(
          guest.username
        );


      if(!currentUser){

        try{

          await f.signInAnonymously(
            auth
          );


          currentUser=
            auth.currentUser;

        }catch(error){

          console.error(
            "Auto login failed:",
            error
          );


          showJoin();

          return;

        }

      }


      await setupPresence();

      listenMessages();

      listenPresence();

      showChat();


    }else{

      showJoin();

    }


  }catch(error){

    console.error(
      "BOOT ERROR:",
      error
    );


    showJoin();


  }finally{

    loading.hidden=true;

  }

}


boot();


/* =====================================================
   PAGE CLEANUP
===================================================== */

window.addEventListener(
  "pagehide",
  ()=>{

    /*
      Firebase onDisconnect()
      handles unexpected closing.
    */

  }
);

</script>
